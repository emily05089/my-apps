<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>号码组合分析器</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;padding:14px;
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:#0b1220;color:#dbe4f0;font-size:14px;line-height:1.5;
}
.wrap{max-width:1180px;margin:0 auto;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-bottom:14px;
}
.brand{font-size:20px;font-weight:700;
  background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;
  background-clip:text;color:transparent;}
.total-badge{
  background:#111c30;border:1px solid #1e3352;border-radius:8px;
  padding:6px 14px;font-size:13px;color:#8fa8c8;
}
.total-badge strong{color:#38bdf8;font-size:15px;}
.card{
  background:#0f1a2b;border:1px solid #1b2c46;border-radius:12px;
  padding:14px 16px;margin-bottom:14px;
}
.card h2{
  font-size:14px;margin:0 0 10px;color:#7dd3fc;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.card h2::before{content:'';width:4px;height:14px;background:#38bdf8;border-radius:2px;}
textarea{
  width:100%;height:130px;background:#0a1423;border:1px solid #1e3352;
  border-radius:8px;color:#dbe4f0;padding:10px;font-family:ui-monospace,Consolas,monospace;
  font-size:13px;resize:vertical;line-height:1.7;
}
textarea:focus{outline:none;border-color:#38bdf8;}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.btn{
  background:#16263f;border:1px solid #24405f;color:#cfe1f5;
  padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;
  transition:.15s;font-family:inherit;
}
.btn:hover:not(:disabled){background:#1d3355;border-color:#38bdf8;color:#fff;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.primary{background:#0369a1;border-color:#0284c7;color:#fff;}
.btn.primary:hover:not(:disabled){background:#0284c7;}
.btn.danger{background:#7f1d1d;border-color:#991b1b;color:#fecaca;}
.btn.danger:hover:not(:disabled){background:#991b1b;}
.btn.ok{background:#065f46;border-color:#047857;color:#d1fae5;}
.btn.ok:hover:not(:disabled){background:#047857;}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.stat{
  background:#0a1423;border:1px solid #1b2c46;border-radius:8px;
  padding:8px 16px;min-width:120px;
}
.stat span{display:block;font-size:11px;color:#7a93b3;}
.stat b{font-size:17px;color:#38bdf8;}
.type-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:6px;max-height:280px;overflow-y:auto;padding:4px;
  border:1px solid #16263f;border-radius:8px;background:#0a1423;
}
.type-item{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;
  cursor:pointer;background:#101d31;border:1px solid transparent;font-size:13px;
}
.type-item:hover{background:#16263f;border-color:#24405f;}
.type-item input{accent-color:#38bdf8;cursor:pointer;margin:0;}
.type-name{color:#cfe1f5;font-family:ui-monospace,monospace;}
.type-count{color:#5b7architecture;color:#6b85a8;font-size:12px;margin-left:auto;}
.hit-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;
}
.hit-item{
  display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;
  cursor:pointer;background:#101d31;font-size:13px;border:1px solid transparent;
}
.hit-item:hover{background:#16263f;border-color:#24405f;}
.hit-item input{accent-color:#f472b6;cursor:pointer;margin:0;}
.info-box{
  margin-top:10px;padding:10px 12px;background:#0a1423;border:1px solid #1b2c46;
  border-radius:8px;font-size:13px;color:#93b4d8;min-height:20px;
  font-family:ui-monospace,monospace;white-space:pre-wrap;
}
.log{
  margin-top:10px;padding:8px 12px;background:#0a1423;border:1px solid #1b2c46;
  border-radius:8px;font-size:12px;color:#7a93b3;max-height:130px;overflow-y:auto;
}
.log div{padding:2px 0;}
.log .err{color:#f87171;}
.log .ok{color:#34d399;}

/* 弹窗 */
.mask{
  position:fixed;inset:0;background:rgba(3,8,16,.78);display:none;
  align-items:center;justify-content:center;z-index:100;padding:16px;
}
.mask.show{display:flex;}
.modal{
  background:#0f1a2b;border:1px solid #24405f;border-radius:14px;
  padding:18px 20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal h3{margin:0 0 14px;font-size:16px;color:#7dd3fc;font-weight:600;}
.modal .field{margin-bottom:12px;}
.modal .field label{display:block;font-size:12px;color:#8fa8c8;margin-bottom:5px;}
.modal input[type=number],.modal input[type=text]{
  width:100%;background:#0a1423;border:1px solid #1e3352;border-radius:7px;
  color:#dbe4f0;padding:8px 10px;font-size:14px;font-family:inherit;
}
.modal input:focus{outline:none;border-color:#38bdf8;}
.picker{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:4px;}
.picker.blue{grid-template-columns:repeat(8,1fr);}
.num-btn{
  background:#101d31;border:1px solid #1e3352;color:#a9c2dd;border-radius:6px;
  padding:7px 0;cursor:pointer;font-size:13px;font-family:ui-monospace,monospace;
  transition:.12s;
}
.num-btn:hover{background:#16263f;border-color:#38bdf8;}
.num-btn.on{background:#dc2626;border-color:#ef4444;color:#fff;font-weight:700;}
.picker.blue .num-btn.on{background:#2563eb;border-color:#3b82f6;}
.range-row{display:flex;align-items:center;gap:8px;}
.range-row input{flex:1;}
.range-row span{color:#7a93b3;font-size:13px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.dup-result{
  background:#0a1423;border:1px solid #1b2c46;border-radius:8px;padding:12px;
  font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;
  max-height:300px;overflow-y:auto;color:#a9c2dd;line-height:1.8;
}
.dup-result .top{color:#fbbf24;}
.hint{font-size:12px;color:#6b85a8;margin-top:6px;}
.chk-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chk-row label{
  display:flex;align-items:center;gap:4px;background:#101d31;padding:4px 9px;
  border-radius:6px;font-size:12.5px;cursor:pointer;border:1px solid transparent;
}
.chk-row label:hover{border-color:#24405f;}
.chk-row input{accent-color:#f472b6;margin:0;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:#0a1423;}
::-webkit-scrollbar-thumb{background:#1e3352;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#2b4a6f;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">号码组合分析器</div>
    <div class="total-badge">全部可能组合 <strong id="totalAll">17,721,088</strong></div>
  </div>

  <!-- 输入 -->
  <section class="card">
    <h2>输入数据</h2>
    <textarea id="inputBox" spellcheck="false" placeholder="每行一条，例如：
03,09,11,13,18,22,23,29-01,02,03,06,09,15
03,04,07,12,18,20,30,32-全部
03,04,07,12,18,20,30,32-2 ✖️51
胆:15,29,拖:4,5,7,11,12,16,23,25,27,32-3"></textarea>
    <div class="row-btns">
      <button class="btn primary" id="btnParse">确定</button>
      <button class="btn" id="btnClear">清空</button>
      <button class="btn" id="btnUndo">← 撤退</button>
      <button class="btn" id="btnRedo">前进 →</button>
    </div>
  </section>

  <!-- 统计 -->
  <section class="card" id="statsCard" style="display:none">
    <h2>数据统计</h2>
    <div class="stats" id="statsBox"></div>
    <div class="type-list" id="typeList"></div>
  </section>

  <!-- 操作 -->
  <section class="card" id="opCard" style="display:none">
    <h2>命中类型</h2>
    <div class="hit-grid" id="hitGrid"></div>
    <div class="row-btns">
      <button class="btn danger" id="btnExcludeHit">排除所选命中类型</button>
    </div>

    <h2 style="margin-top:18px">筛选</h2>
    <div class="row-btns">
      <button class="btn" id="btnPrizeRatio">保留奖金比例</button>
      <button class="btn" id="btnHasPrizeRatio">有奖金行数比例</button>
      <button class="btn" id="btnHitCount">筛选中奖行数</button>
    </div>
    <div class="row-btns">
      <button class="btn" id="btnDupQuery">重复情况查询</button>
      <button class="btn" id="btnSmartDup">智能重复排除</button>
      <button class="btn" id="btnSetDraw">设置开奖号码</button>
    </div>

    <div class="info-box" id="infoBox">开奖号码：未设置</div>

    <h2 style="margin-top:18px">当前结果</h2>
    <div class="stats" id="remainBox"></div>
    <div class="row-btns">
      <button class="btn primary" id="btnExport">导出 Excel</button>
    </div>
  </section>

  <div class="log" id="log"></div>
</div>

<!-- ============ 弹窗：选择开奖号码 ============ -->
<div class="mask" id="maskDraw">
  <div class="modal">
    <h3>选择开奖号码</h3>
    <div class="field">
      <label>红球（选 6 个）<span id="drawRedCnt" style="color:#38bdf8">0/6</span></label>
      <div class="picker" id="pickRed"></div>
    </div>
    <div class="field">
      <label>蓝球（选 1 个）<span id="drawBlueCnt" style="color:#3b82f6">0/1</span></label>
      <div class="picker blue" id="pickBlue"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="drawOk">确定</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：奖金比例 ============ -->
<div class="mask" id="maskPrize">
  <div class="modal">
    <h3>保留奖金比例</h3>
    <div class="field">
      <label>奖金占投注金额比例（%）</label>
      <div class="range-row">
        <input type="number" id="prizeMin" value="10" step="0.01">
        <span>到</span>
        <input type="number" id="prizeMax" value="30" step="0.01">
        <span>%</span>
      </div>
    </div>
    <div class="hint">按行计算：该行所有注的中奖总额 ÷ 该行投注金额 × 100%</div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="prizeOk">确定</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：有奖金行数比例 ============ -->
<div class="mask" id="maskHasPrize">
  <div class="modal">
    <h3>有奖金行数比例</h3>
    <div class="field">
      <label>有奖金注数占该行总注数的比例（%）</label>
      <div class="range-row">
        <input type="number" id="hpMin" value="0" step="0.01">
        <span>到</span>
        <input type="number" id="hpMax" value="100" step="0.01">
        <span>%</span>
      </div>
    </div>
    <div class="hint">未勾选任何行类型时默认应用于所有行</div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="hpOk">确定</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：筛选中奖行数 ============ -->
<div class="mask" id="maskHitCount">
  <div class="modal">
    <h3>筛选中奖行数</h3>
    <div class="field">
      <label>勾选的行类型 <span style="color:#6b85a8">(不勾选则等于全部)</span></label>
      <div class="chk-row" id="hcTypes"></div>
    </div>
    <div class="field">
      <label>勾选的命中类型</label>
      <div class="chk-row" id="hcHits"></div>
    </div>
    <div class="field">
      <label>该行内命中此类型的注数区间</label>
      <div class="range-row">
        <input type="number" id="hcMin" value="0" step="1">
        <span>到</span>
        <input type="number" id="hcMax" value="3" step="1">
      </div>
    </div>
    <div class="info-box" id="hcInfo">请勾选行类型与命中类型以查看奖金</div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="hcOk">确定</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：重复情况查询 ============ -->
<div class="mask" id="maskDup">
  <div class="modal">
    <h3>重复情况查询</h3>
    <div class="field">
      <label>选择开奖号码 — 红球（6 个）<span id="dupRedCnt" style="color:#38bdf8">0/6</span></label>
      <div class="picker" id="dupRed"></div>
    </div>
    <div class="field">
      <label>蓝球（1 个）<span id="dupBlueCnt" style="color:#3b82f6">0/1</span></label>
      <div class="picker blue" id="dupBlue"></div>
    </div>
    <div class="field">
      <label>查询结果</label>
      <div class="dup-result" id="dupResult">请选择号码后点击「开始查询」</div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>关闭</button>
      <button class="btn primary" id="dupRun">开始查询</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：智能重复排除 ============ -->
<div class="mask" id="maskSmart">
  <div class="modal">
    <h3>智能重复排除</h3>
    <div class="field">
      <label>重复次数区间</label>
      <div class="range-row">
        <input type="number" id="smMin" value="1" step="1" min="1">
        <span>到</span>
        <input type="number" id="smMax" value="22" step="1" min="1">
      </div>
    </div>
    <div class="field">
      <label>命中类型（将排除命中的注所在的行）</label>
      <div class="chk-row" id="smHits"></div>
    </div>
    <div class="field">
      <label>开奖号码</label>
      <div class="picker" id="smRed"></div>
      <div class="picker blue" id="smBlue" style="margin-top:5px"></div>
      <div class="hint" id="smDrawInfo">未选择</div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn danger" id="smOk">开始排除</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   基础工具
   ========================================================= */
const CT = (() => {
  const t = [];
  for (let n = 0; n <= 40; n++) {
    t[n] = new Array(n + 1).fill(0);
    t[n][0] = 1;
    for (let k = 1; k <= n; k++) t[n][k] = (k === n) ? 1 : t[n - 1][k - 1] + t[n - 1][k];
  }
  return t;
})();
function C(n, k) {
  if (n < 0 || k < 0 || k > n) return 0;
  return CT[n][k];
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmt(n) { return n.toLocaleString('en-US'); }
function $(id) { return document.getElementById(id); }

/* 命中类型 */
const HIT_TYPES = ['6+1','6+0','5+1','5+0','4+1','4+0','3+1','2+1','1+1','0+1','3+0','2+0','1+0','0+0'];
const HIT_LABEL = {};
HIT_TYPES.forEach(h => HIT_LABEL[h] = '中' + h);

/* 单注奖金 */
const PRIZE = {
  '6+1': 5000000,
  '6+0': 500000,
  '5+1': 3000,
  '5+0': 200,
  '4+1': 200,
  '4+0': 10,
  '3+1': 10,
  '2+1': 5,
  '1+1': 5,
  '0+1': 5,
};
/* 命中等级（用于“最多中几+几”） */
const HIT_RANK = {
  '6+1': 100, '6+0': 90, '5+1': 80, '5+0': 70, '4+1': 70, '4+0': 60,
  '3+1': 60, '2+1': 50, '1+1': 50, '0+1': 50, '3+0': 40, '2+0': 30,
  '1+0': 20, '0+0': 10
};

/* 全局状态 */
let rows = [];            // 当前剩余行
let historyStack = [];
let historyIndex = -1;
let drawNumber = null;    // {reds:[], blue:int}

/* =========================================================
   日志
   ========================================================= */
function log(msg, type) {
  const box = $('log');
  const d = document.createElement('div');
  if (type) d.className = type;
  const t = new Date();
  d.textContent = `[${pad2(t.getHours())}:${pad2(t.getMinutes())}:${pad2(t.getSeconds())}] ${msg}`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

/* =========================================================
   解析
   ========================================================= */
function parseBlues(str) {
  if (!str) return [1];
  if (str.indexOf('全') >= 0) {
    const a = [];
    for (let i = 1; i <= 16; i++) a.push(i);
    return a;
  }
  const arr = str.split(',').filter(Boolean).map(Number).filter(n => n >= 1 && n <= 16);
  return arr.length ? arr : [1];
}

function parseLine(raw) {
  let s = String(raw).trim();
  if (!s) return null;

  s = s.replace(/\uFE0F/g, '');
  s = s.replace(/[✖×xX*]/g, '×');
  s = s.replace(/[，、；;]/g, ',');
  s = s.replace(/\s+/g, '');

  let multiple = 1;
  const mMul = s.match(/×(\d+)$/);
  if (mMul) {
    multiple = parseInt(mMul[1], 10) || 1;
    s = s.slice(0, mMul.index);
  }

  const isDanTuo = /胆/.test(s) && /拖/.test(s);

  const di = s.lastIndexOf('-');
  const mainPart = di >= 0 ? s.slice(0, di) : s;
  const bluePart = di >= 0 ? s.slice(di + 1) : '';

  let dan = [], tuo = [], reds = [];

  if (isDanTuo) {
    const danM = mainPart.match(/胆[:：]?([\d,]+)/);
    const tuoM = mainPart.match(/拖[:：]?([\d,]+)/);
    if (danM) dan = danM[1].split(',').filter(Boolean).map(Number);
    if (tuoM) tuo = tuoM[1].split(',').filter(Boolean).map(Number);
    reds = dan.concat(tuo);
  } else {
    reds = mainPart.split(',').filter(Boolean).map(Number);
  }

  reds = reds.filter(n => n >= 1 && n <= 33);
  const uniq = [...new Set(reds)];
  reds = uniq;

  if (isDanTuo) {
    dan = dan.filter(n => n >= 1 && n <= 33);
    tuo = tuo.filter(n => n >= 1 && n <= 33);
    tuo = tuo.filter(n => dan.indexOf(n) < 0);
    if (dan.length + tuo.length < 6) return null;
  } else {
    if (reds.length < 6) return null;
  }

  const blues = parseBlues(bluePart);
  if (!blues.length) return null;

  const isDT = isDanTuo && dan.length > 0;
  let baseBets;
  if (isDT) {
    baseBets = C(tuo.length, 6 - dan.length);
  } else {
    baseBets = C(reds.length, 6);
  }
  if (!baseBets) return null;

  const bets = baseBets * blues.length * multiple;

  const typeName = isDT
    ? `${dan.length}胆${tuo.length}拖➕${blues.length}`
    : `${reds.length}➕${blues.length}`;

  return {
    raw: raw,
    isDanTuo: isDT,
    dan: isDT ? dan.slice().sort((a, b) => a - b) : [],
    tuo: isDT ? tuo.slice().sort((a, b) => a - b) : [],
    reds: isDT ? (dan.concat(tuo)).sort((a, b) => a - b) : reds.slice().sort((a, b) => a - b),
    blues: blues.slice().sort((a, b) => a - b),
    multiple: multiple,
    baseBets: baseBets,
    bets: bets,
    typeName: typeName
  };
}

/* =========================================================
   行统计计算
   ========================================================= */
function computeRowStats(row, wrSet, wb) {
  const B = row.blues;
  let blueHit = 0;
  for (let i = 0; i < B.length; i++) if (B[i] === wb) { blueHit = 1; break; }
  const blueMiss = B.length - blueHit;

  const redCnt = new Array(7).fill(0);

  if (row.isDanTuo) {
    const d = row.dan, t = row.tuo;
    let a = 0;
    for (let i = 0; i < d.length; i++) if (wrSet.has(d[i])) a++;
    let b = 0;
    for (let i = 0; i < t.length; i++) if (wrSet.has(t[i])) b++;
    const need = 6 - d.length;
    const tn = t.length;
    const jStart = Math.max(0, need - (tn - b));
    const jEnd = Math.min(need, b);
    for (let j = jStart; j <= jEnd; j++) {
      const k = a + j;
      if (k > 6) continue;
      redCnt[k] += C(b, j) * C(tn - b, need - j);
    }
  } else {
    const R = row.reds;
    let h = 0;
    for (let i = 0; i < R.length; i++) if (wrSet.has(R[i])) h++;
    const n = R.length;
    for (let k = 0; k <= 6; k++) redCnt[k] = C(h, k) * C(n - h, 6 - k);
  }

  const hits = {};
  let prizeBase = 0;
  for (let k = 0; k <= 6; k++) {
    const c = redCnt[k];
    if (!c) continue;
    if (blueHit) {
      const key = k + '+1';
      const cnt = c * blueHit;
      hits[key] = (hits[key] || 0) + cnt;
      prizeBase += cnt * (PRIZE[key] || 0);
    }
    if (blueMiss) {
      const key = k + '+0';
      const cnt = c * blueMiss;
      hits[key] = (hits[key] || 0) + cnt;
      prizeBase += cnt * (PRIZE[key] || 0);
    }
  }

  return {
    hits: hits,
    prize: prizeBase * row.multiple,
    betAmount: row.bets * 2,
    prizeBets: (() => {
      let n = 0;
      for (const k in hits) if (PRIZE[k]) n += hits[k];
      return n * row.multiple;
    })()
  };
}

/* =========================================================
   历史记录
   ========================================================= */
function snapshot() {
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(rows.slice());
  if (historyStack.length > 60) {
    historyStack.shift();
  }
  historyIndex = historyStack.length - 1;
  updateUndoRedo();
}
function updateUndoRedo() {
  $('btnUndo').disabled = historyIndex <= 0;
  $('btnRedo').disabled = historyIndex >= historyStack.length - 1;
}
function doUndo() {
  if (historyIndex <= 0) return;
  historyIndex--;
  rows = historyStack[historyIndex].slice();
  render();
  updateUndoRedo();
  log('撤退一步，当前 ' + fmt(rows.length) + ' 行');
}
function doRedo() {
  if (historyIndex >= historyStack.length - 1) return;
  historyIndex++;
  rows = historyStack[historyIndex].slice();
  render();
  updateUndoRedo();
  log('前进一步，当前 ' + fmt(rows.length) + ' 行');
}

/* =========================================================
   渲染
   ========================================================= */
function sortKeyOf(row) {
  if (row.isDanTuo) return [1, row.dan.length, row.tuo.length, row.blues.length];
  return [0, row.reds.length, 0, row.blues.length];
}
function cmpKey(a, b) {
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return a[i] - b[i];
  }
  return 0;
}

function render() {
  const totalRows = rows.length;
  let totalBets = 0;
  for (let i = 0; i < rows.length; i++) totalBets += rows[i].bets;

  $('statsBox').innerHTML = `
    <div class="stat"><span>行数</span><b>${fmt(totalRows)}</b></div>
    <div class="stat"><span>注数</span><b>${fmt(totalBets)}</b></div>
    <div class="stat"><span>投注金额</span><b>${fmt(totalBets * 2)} 元</b></div>
  `;

  $('remainBox').innerHTML = `
    <div class="stat"><span>剩余行数</span><b>${fmt(totalRows)}</b></div>
    <div class="stat"><span>剩余注数</span><b>${fmt(totalBets)}</b></div>
    <div class="stat"><span>剩余金额</span><b>${fmt(totalBets * 2)} 元</b></div>
  `;

  /* 类型分组 */
  const map = new Map();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    let e = map.get(r.typeName);
    if (!e) {
      e = { name: r.typeName, count: 0, bets: 0, sort: sortKeyOf(r) };
      map.set(r.typeName, e);
    }
    e.count++;
    e.bets += r.bets;
  }
  const arr = [...map.values()].sort((a, b) => cmpKey(a.sort, b.sort));

  let html = '';
  for (const e of arr) {
    html += `<label class="type-item">
      <input type="checkbox" data-type="${e.name}">
      <span class="type-name">${e.name}</span>
      <span class="type-count">（${fmt(e.count)}行）</span>
    </label>`;
  }
  $('typeList').innerHTML = html;

  $('statsCard').style.display = rows.length ? '' : 'none';
  $('opCard').style.display = rows.length ? '' : 'none';

  updateInfoBox();
}

  log(`解析完成：${fmt(rows.length)} 行，${fmt(totalBets)} 注，耗时 ${(t1 - t0).toFixed(1)} ms` + (errCount ? `，${errCount} 行失败` : ''), 'ok');

  el.innerHTML = '';

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'num-btn';
    b.textContent = pad2(i);

    b.addEventListener('click', () => {
      const idx = el._sel.indexOf(i);
      if (idx >= 0) {

        b.classList.remove('on');
      } else {
        if (el._sel.length >= need) return;
        el._sel.push(i);
        b.classList.add('on');
      }
      if (onChange) onChange(el._sel);
    });
    el.appendChild(b);
  }
}

/* =========================================================
   展开单注
   ========================================================= */
function kCombinations(arr, k) {
  const res = [];
  const n = arr.length;
  if (k > n || k <= 0) return res;
  const idx = [];
  for (let i = 0; i < k; i++) idx.push(i);
  while (true) {
    const c = new Array(k);
    for (let i = 0; i < k; i++) c[i] = arr[idx[i]];
    res.push(c);
    let i = k - 1;
    while (i >= 0 && idx[i] === n - k + i) i--;
    if (i < 0) break;
    idx[i]++;
    for (let j = i + 1; j < k; j++) idx[j] = idx[j - 1] + 1;
  }
  return res;
}

function expandRow(row, cb) {
  if (row.isDanTuo) {
    const need = 6 - row.dan.length;
    const combos = kCombinations(row.tuo, need);
    for (const c of combos) {
      const reds = row.dan.concat(c).sort((a, b) => a - b);
      for (const b of row.blues) cb(reds, b);
    }
  } else {
    const combos = kCombinations(row.reds, 6);
    for (const c of combos) {
      for (const b of row.blues) cb(c, b);
    }
  }
}

$('dupRun').addEventListener('click', () => {
  const dr = $('dupRed')._sel.slice().sort((a, b) => a - b);
  const db = $('dupBlue')._sel.slice();
  if (dr.length !== 6 || db.length !== 1) { alert('请选择 6 个红球和 1 个蓝球'); return; }

  const wrSet = new Set(dr);
  const wb = db[0];

  const t0 = performance.now();

  const map = new Map();
  for (const row of rows) {
    expandRow(row, (reds, blue) => {
      const key = reds.join(',') + '|' + blue;
      let e = map.get(key);
      if (!e) { e = { count: 0, reds: reds, blue: blue }; map.set(key, e); }
      e.count++;
    });
  }

  /* 按重复次数分组，取最高命中 */
  const groups = new Map(); // count -> bestHit
  for (const e of map.values()) {
    if (e.count < 2) continue;
    let hit = 0, blueHit = 0;
    for (const r of e.reds) if (wrSet.has(r)) hit++;
    if (e.blue === wb) blueHit = 1;
    const key = hit + '+' + blueHit;
    const rank = HIT_RANK[key] || 0;
    const cur = groups.get(e.count);
    if (!cur || rank > cur.rank) groups.set(e.count, { rank: rank, hit: key });
  }

  const t1 = performance.now();

  const list = [...groups.entries()].sort((a, b) => b[0] - a[0]);
  if (!list.length) {
    $('dupResult').textContent = '没有重复的注（重复 2 次及以上）';
    return;
  }

  let out = '';
  for (const [cnt, info] of list) {
    out += `重复${cnt}次最多中${info.hit}\n`;
  }
  $('dupResult').textContent = out;
  log(`重复查询完成，耗时 ${(t1 - t0).toFixed(0)} ms`, 'ok');
});

  for (const [key, cnt] of map.entries()) {
    if (cnt >= minR && cnt <= maxR) targetSet.add(key);
  }

  /* 3. 逐行判断：若该行中任一注命中勾选命中类型 → 排除 */
  let removed = 0;
  const keep = [];
  const hitSet = new Set(hits);

  for (const row of rows) {
    const st = computeRowStats(row, wrSet, wb);
    let matched = false;
    for (const h of hitSet) {
      if (st.hits[h] > 0) { matched = true; break; }
    }
    if (matched) removed++;
    else keep.push(row);
  }

  rows = keep;
  snapshot();
  render();
  log(`智能重复排除完成：移除 ${fmt(removed)} 行，剩余 ${fmt(rows.length)} 行`, 'ok');
});

/* =========================================================
   导出
   ========================================================= */
$('btnExport').addEventListener('click', () => {
  if (!rows.length) { alert('没有可导出的数据'); return; }

  const lines = [];
  for (const row of rows) {
    let redStr, blueStr;
    if (row.isDanTuo) {
      redStr = '胆:' + row.dan.map(pad2).join(',') + ',拖:' + row.tuo.map(pad2).join(',');
    } else {
      redStr = row.reds.map(pad2).join(',');
    }
    blueStr = row.blues.map(pad2).join(',');
    let line = redStr + '-' + blueStr;
    if (row.multiple > 1) line += ' ✖️' + row.multiple;
    lines.push(line);
  }

  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = new Date();
  const stamp = `${t.getFullYear()}${pad2(t.getMonth() + 1)}${pad2(t.getDate())}_${pad2(t.getHours())}${pad2(t.getMinutes())}${pad2(t.getSeconds())}`;
  a.href = url;
  a.download = `组合结果_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  log(`已导出 ${fmt(rows.length)} 行`, 'ok');
});

/* =========================================================
   初始化
   ========================================================= */
updateInfoBox();
updateUndoRedo();
log('系统就绪。全部可能组合 17,721,088 个。');
</script>
