<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>彩票识别上传</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, sans-serif; 
            background: #f5f5f5; 
            padding: 20px;
            max-width: 100vw;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #333; }
        
        .batch-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .batch-title {
            font-size: 16px;
            font-weight: 600;
            color: #e74c3c;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .batch-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #e74c3c;
            border-radius: 2px;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: #fafafa;
        }
        input[type="file"]:active { border-color: #e74c3c; background: #fff5f5; }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .preview-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .count-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .tip {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            margin-top: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:active { opacity: 0.9; transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 双色球彩票识别</h1>
        
        <div class="tip">
            ⚠️ iPhone限制：每批最多选<strong>100张</strong><br>
            130张请分<strong>2批</strong>上传（如：70张 + 60张）
        </div>
        
        <!-- 第一批 -->
        <div class="batch-box">
            <div class="batch-title">
                第一批 <span class="count-badge" id="count1">0张</span>
            </div>
            <input type="file" id="batch1" accept="image/*" multiple 
                   onchange="handleFiles(this, 1)">
            <div class="preview-grid" id="preview1"></div>
        </div>
        
        <!-- 第二批 -->
        <div class="batch-box">
            <div class="batch-title">
                第二批 <span class="count-badge" id="count2">0张</span>
            </div>
            <input type="file" id="batch2" accept="image/*" multiple 
                   onchange="handleFiles(this, 2)">
            <div class="preview-grid" id="preview2"></div>
        </div>
        
        <!-- 第三批（备用） -->
        <div class="batch-box">
            <div class="batch-title">
                第三批（备用）<span class="count-badge" id="count3">0张</span>
            </div>
            <input type="file" id="batch3" accept="image/*" multiple 
                   onchange="handleFiles(this, 3)">
            <div class="preview-grid" id="preview3"></div>
        </div>
        
        <button class="submit-btn" onclick="submitAll()">
            开始识别全部彩票
        </button>
    </div>

    <script>
        const allFiles = {1: [], 2: [], 3: []};
        
        function handleFiles(input, batchNum) {
            const files = Array.from(input.files);
            allFiles[batchNum] = files;
            
            // 更新计数
            document.getElementById('count' + batchNum).textContent = files.length + '张';
            
            // 预览（最多显示8张）
            const preview = document.getElementById('preview' + batchNum);
            preview.innerHTML = '';
            files.slice(0, 8).forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            });
            
            // 如果还有更多，显示"+N"
            if (files.length > 8) {
                const more = document.createElement('div');
                more.style.cssText = 'display:flex;align-items:center;justify-content:center;background:#f0f0f0;border-radius:6px;font-size:14px;color:#666;';
                more.textContent = '+' + (files.length - 8);
                preview.appendChild(more);
            }
        }
        
        function submitAll() {
            const total = [...allFiles[1], ...allFiles[2], ...allFiles[3]];
            if (total.length === 0) {
                alert('请至少选择一张图片');
                return;
            }
            alert(`已选择 ${total.length} 张图片，准备识别...`);
            // 这里可以将total发送到服务器
            console.log('总图片数:', total.length);
        }
    </script>
</body>
</html>
