<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双色球彩票红球识别工具</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3/build/pdf.min.js">
    </script>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --danger: #d93025;
            --success: #188038;
            --warning: #e6a817;
            --text: #202124;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Microsoft YaHei Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* Header */
        .app-header {
            text-align: center;
            padding: 24px 0 16px;
        }
        .app-header .icon-wrap {
            display: inline-block;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #e63946, #ff6b6b);
            border-radius: 50%;
            font-size: 30px;
            line-height: 56px;
            margin-bottom: 8px;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.3);
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .app-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .badge {
            font-size: 0.75rem;
            background: #e8f0fe;
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: #fafbfc;
            position: relative;
        }
        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: var(--primary);
            background: #f0f5ff;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.06);
        }
        .upload-zone .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        .upload-zone .upload-text {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
        }
        .upload-zone .upload-hint {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* File List */
        .file-list {
            max-height: 360px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: #fafbfc;
            margin-bottom: 6px;
            border: 1px solid #eee;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .file-item .thumb {
            width: 44px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            flex-shrink: 0;
            background: #fff;
        }
        .file-item .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-item .file-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item .file-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .file-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-pending {
            background: #ccc;
        }
        .status-processing {
            background: #f9ab00;
            animation: pulse 0.8s infinite;
        }
        .status-done {
            background: var(--success);
        }
        .status-error {
            background: var(--danger);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .file-item .btn-remove {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .file-item .btn-remove:hover {
            color: var(--danger);
            background: #fce8e6;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.3);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 14px rgba(26, 115, 232, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: #a8c7fa;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: #e8f0fe;
        }
        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 2px solid var(--danger);
        }
        .btn-danger:hover {
            background: #fce8e6;
        }
        .btn-copy {
            background: #fff;
            color: var(--success);
            border: 2px solid var(--success);
            font-family: var(--font-mono);
        }
        .btn-copy:hover {
            background: #e6f4ea;
        }

        /* Progress */
        .progress-wrap {
            margin-top: 12px;
        }
        .progress-bar-outer {
            height: 8px;
            background: #e8eaed;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #1a73e8, #4da3ff);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: center;
        }

        /* Output */
        .output-area {
            width: 100%;
            min-height: 200px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            resize: vertical;
            background: #fefefe;
            line-height: 1.7;
            letter-spacing: 0.3px;
            tab-size: 4;
        }
        .output-area:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.08);
        }
        .output-stats {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #323232;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 9999;
            animation: fadeInOut 2.2s ease forwards;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(-16px);
            }
            12% {
                opacity: 1;
                transform: translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-12px);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-header h1 {
                font-size: 1.3rem;
            }
            .card {
                padding: 14px 12px;
            }
            .upload-zone {
                padding: 24px 12px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.82rem;
            }
            .file-item {
                padding: 8px;
                gap: 6px;
            }
            .file-item .thumb {
                width: 32px;
                height: 42px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c4c7cc;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a4a9;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="icon-wrap">🎱</div>
            <h1>双色球彩票红球识别工具</h1>
            <p class="subtitle">上传彩票图片或PDF，自动识别红球号码、倍数、胆拖</p>
        </div>

        <!-- Upload Card -->
        <div class="card" id="uploadCard">
            <div class="card-title">
                📤 上传文件
                <span class="badge" id="fileCountBadge">未选择文件</span>
            </div>
            <div class="upload-zone" id="uploadZone">
                <span class="upload-icon">📁</span>
                <div class="upload-text">点击选择文件或拖拽到此处</div>
                <div class="upload-hint">支持 JPG / PNG / BMP / WEBP / PDF（图片可多选，PDF限一个）</div>
                <input type="file" id="fileInput" accept="image/*,.pdf" multiple>
            </div>
            <div class="file-list" id="fileList"></div>
            <div class="btn-row">
                <button class="btn btn-outline" id="btnClearFiles" title="清除所有已上传文件">🗑️ 清空文件</button>
                <button class="btn btn-primary" id="btnStartRecognition" disabled>
                    🔍 开始识别
                </button>
                <span style="font-size:0.82rem;color:var(--text-secondary);align-self:center;" id="workerHint"></span>
            </div>
            <div class="progress-wrap" id="progressWrap" style="display:none;">
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">准备中...</div>
            </div>
        </div>

        <!-- Output Card -->
        <div class="card" id="outputCard">
            <div class="card-title">
                📋 识别结果
                <span class="badge" id="resultStats">等待识别</span>
            </div>
            <textarea class="output-area" id="outputArea" placeholder="识别结果将显示在这里...&#10;格式：红球号码用英文逗号隔开，一行一组号码&#10;倍数会自动展开为多行&#10;胆拖格式：胆:01,02,03，拖:04,05,06,07,08,09" readonly></textarea>
            <div class="btn-row">
                <button class="btn btn-copy" id="btnCopy" disabled>📋 一键复制全部结果</button>
                <button class="btn btn-outline" id="btnDownload" disabled>💾 下载结果文本</button>
                <span class="output-stats" id="outputStats"></span>
            </div>
        </div>

        <!-- Info Card -->
        <div class="card" style="font-size:0.82rem;color:var(--text-secondary);">
            <strong>💡 说明：</strong>
            数字1-9自动补零为01-09；倍数（括号/方括号/倍数字样）自动展开为多行；胆拖格式为"胆:xx,xx，拖:xx,xx"；按图片顺序依次识别。
            <br><strong>⚠️ 注意：</strong>OCR识别依赖图片清晰度，请确保彩票图片清晰、光线均匀。识别完成后请核对结果。
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM元素 ====================
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const fileListEl = document.getElementById('fileList');
            const fileCountBadge = document.getElementById('fileCountBadge');
            const btnClearFiles = document.getElementById('btnClearFiles');
            const btnStartRecognition = document.getElementById('btnStartRecognition');
            const progressWrap = document.getElementById('progressWrap');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const outputArea = document.getElementById('outputArea');
            const resultStats = document.getElementById('resultStats');
            const btnCopy = document.getElementById('btnCopy');
            const btnDownload = document.getElementById('btnDownload');
            const outputStats = document.getElementById('outputStats');
            const workerHint = document.getElementById('workerHint');

            // ==================== 状态变量 ====================
            let allFiles = []; // { file, type:'image'|'pdf', previewUrl?, pdfPages?, status:'pending'|'processing'|'done'|'error', resultText? }
            let isProcessing = false;
            let abortController = null;
            let ocrWorker = null;
            let ocrScheduler = null;
            let tesseractReady = false;
            let totalToProcess = 0;
            let processedCount = 0;

            // ==================== 工具函数 ====================
            function showToast(msg) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2300);
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(2) + ' MB';
            }

            function padZero(num) {
                const n = parseInt(num, 10);
                if (isNaN(n)) return String(num).trim();
                if (n >= 1 && n <= 9) return '0' + n;
                if (n >= 10 && n <= 33) return String(n);
                return String(num).trim();
            }

            function isRedBall(num) {
                const n = parseInt(num, 10);
                return !isNaN(n) && n >= 1 && n <= 33;
            }

            // ==================== 文件管理 ====================
            function updateUI() {
                const totalFiles = allFiles.length;
                fileCountBadge.textContent = totalFiles === 0 ? '未选择文件' : `已选 ${totalFiles} 个文件`;
                btnStartRecognition.disabled = totalFiles === 0 || isProcessing;
                btnClearFiles.disabled = isProcessing;

                if (totalFiles === 0) {
                    fileListEl.innerHTML =
                        '<div style="text-align:center;color:#999;padding:20px;">暂无文件，请上传彩票图片或PDF</div>';
                }

                // 更新worker提示
                if (tesseractReady && totalFiles > 0 && !isProcessing) {
                    workerHint.textContent = '✅ OCR引擎就绪';
                    workerHint.style.color = 'var(--success)';
                } else if (!tesseractReady && totalFiles > 0) {
                    workerHint.textContent = '⏳ OCR引擎加载中...';
                    workerHint.style.color = 'var(--warning)';
                } else {
                    workerHint.textContent = '';
                }
            }

            function renderFileList() {
                if (allFiles.length === 0) {
                    fileListEl.innerHTML =
                        '<div style="text-align:center;color:#999;padding:20px;">暂无文件，请上传彩票图片或PDF</div>';
                    return;
                }
                fileListEl.innerHTML = allFiles.map((f, i) => {
                    const statusClass = 'status-' + f.status;
                    let thumbHtml = '';
                    if (f.type === 'image' && f.previewUrl) {
                        thumbHtml = `<img class="thumb" src="${f.previewUrl}" alt="预览">`;
                    } else if (f.type === 'pdf') {
                        thumbHtml =
                            '<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:#fef3f3;">📄</div>';
                    } else {
                        thumbHtml =
                            '<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#f5f5f5;">🖼️</div>';
                    }
                    const statusLabel = f.status === 'pending' ? '等待中' : f.status === 'processing' ?
                        '识别中...' : f.status === 'done' ? '已完成' : '失败';
                    return `
                        <div class="file-item">
                            ${thumbHtml}
                            <div class="file-info">
                                <div class="file-name" title="${f.file.name}">${f.file.name}</div>
                                <div class="file-meta">${formatFileSize(f.file.size)} · ${f.type === 'pdf' ? 'PDF文档' : '图片'} · ${statusLabel}</div>
                            </div>
                            <div class="status-dot ${statusClass}"></div>
                            <button class="btn-remove" data-index="${i}" title="移除" ${isProcessing ? 'disabled' : ''}>✕</button>
                        </div>`;
                }).join('');

                // 绑定移除按钮
                fileListEl.querySelectorAll('.btn-remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = parseInt(btn.dataset.index, 10);
                        if (!isProcessing && idx >= 0 && idx < allFiles.length) {
                            removeFile(idx);
                        }
                    });
                });
            }

            function removeFile(index) {
                const f = allFiles[index];
                if (f.previewUrl && f.previewUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(f.previewUrl);
                }
                allFiles.splice(index, 1);
                renderFileList();
                updateUI();
                resetOutput();
            }

            function clearAllFiles() {
                if (isProcessing) return;
                allFiles.forEach(f => {
                    if (f.previewUrl && f.previewUrl.startsWith('blob:')) {
                        URL.revokeObjectURL(f.previewUrl);
                    }
                });
                allFiles = [];
                fileInput.value = '';
                renderFileList();
                updateUI();
                resetOutput();
                progressWrap.style.display = 'none';
                progressBar.style.width = '0%';
                progressText.textContent = '';
                processedCount = 0;
                totalToProcess = 0;
            }

            function resetOutput() {
                outputArea.value = '';
                resultStats.textContent = '等待识别';
                btnCopy.disabled = true;
                btnDownload.disabled = true;
                outputStats.textContent = '';
            }

            function addFiles(files) {
                let imageCount = allFiles.filter(f => f.type === 'image').length;
                const pdfCount = allFiles.filter(f => f.type === 'pdf').length;

                for (const file of files) {
                    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        if (pdfCount + (allFiles.filter(f => f.type === 'pdf').length > 0 ? 0 : 1) > 1 &&
                            allFiles.some(f => f.type === 'pdf')) {
                            showToast('⚠️ PDF文件只允许上传一个，已跳过重复PDF');
                            continue;
                        }
                        const previewUrl = URL.createObjectURL(file);
                        allFiles.push({ file, type: 'pdf', previewUrl, pdfPages: null, status: 'pending',
                            resultText: '' });
                    } else if (file.type.startsWith('image/') || /\.(jpg|jpeg|png|bmp|webp|gif|tiff?)$/i.test(file
                            .name)) {
                        imageCount++;
                        const previewUrl = URL.createObjectURL(file);
                        allFiles.push({ file, type: 'image', previewUrl, status: 'pending', resultText: '' });
                    } else {
                        // 尝试作为图片处理
                        const previewUrl = URL.createObjectURL(file);
                        allFiles.push({ file, type: 'image', previewUrl, status: 'pending', resultText: '' });
                    }
                }
                renderFileList();
                updateUI();
                resetOutput();
                progressWrap.style.display = 'none';
            }

            // ==================== 事件监听 ====================
            uploadZone.addEventListener('click', (e) => {
                if (e.target === fileInput) return;
                fileInput.click();
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    addFiles(Array.from(e.target.files));
                    fileInput.value = '';
                }
            });
            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.add('drag-over');
            });
            uploadZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('drag-over');
            });
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('drag-over');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    addFiles(Array.from(e.dataTransfer.files));
                }
            });
            btnClearFiles.addEventListener('click', clearAllFiles);

            // ==================== Tesseract.js初始化 ====================
            async function initTesseract() {
                if (tesseractReady && ocrWorker) return;
                try {
                    workerHint.textContent = '⏳ 加载OCR引擎...';
                    workerHint.style.color = 'var(--warning)';
                    // 创建单个worker用于顺序处理（更稳定）
                    ocrWorker = await Tesseract.createWorker('chi_sim', 1, {
                        logger: (m) => {
                            if (m.status === 'loading tesseract core' || m.status === 'loading language traineddata') {
                                const pct = m.progress ? Math.round(m.progress * 100) : 0;
                                workerHint.textContent = `⏳ 加载OCR引擎 ${pct}%...`;
                            }
                        }
                    });
                    // 设置参数提高识别准确率
                    await ocrWorker.setParameters({
                        tessedit_pageseg_mode: '6', // 假设为统一文本块
                        tessedit_char_whitelist: '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ()[]（）【】倍胆拖,:,.，
                            ',
                    });
                    tesseractReady = true;
                    workerHint.textContent = '✅ OCR引擎就绪';
                    workerHint.style.color = 'var(--success)';
                    updateUI();
                } catch (err) {
                    console.error('Tesseract初始化失败:', err);
                    workerHint.textContent = '❌ OCR引擎加载失败，请刷新重试';
                    workerHint.style.color = 'var(--danger)';
                    tesseractReady = false;
                    throw err;
                }
            }

            // 预初始化
            initTesseract().catch(() => {});

            // ==================== 图像预处理 ====================
            function preprocessImage(imageElement) {
                const canvas = document.createElement('canvas');
                const maxWidth = 1800;
                const maxHeight = 2400;
                let w = imageElement.naturalWidth || imageElement.width;
                let h = imageElement.naturalHeight || imageElement.height;

                // 缩放
                if (w > maxWidth || h > maxHeight) {
                    const ratio = Math.min(maxWidth / w, maxHeight / h);
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');

                // 绘制
                ctx.drawImage(imageElement, 0, 0, w, h);

                // 获取图像数据
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;

                // 灰度化 + 对比度增强
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    // 加权灰度
                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    // 对比度拉伸
                    gray = ((gray - 128) * 1.4) + 128;
                    gray = Math.max(0, Math.min(255, gray));
                    data[i] = gray;
                    data[i + 1] = gray;
                    data[i + 2] = gray;
                }
                ctx.putImageData(imageData, 0, 0);

                return canvas;
            }

            // ==================== OCR识别单张图片 ====================
            async function ocrImage(imageElement) {
                if (!tesseractReady || !ocrWorker) {
                    await initTesseract();
                }
                const processedCanvas = preprocessImage(imageElement);
                const result = await ocrWorker.recognize(processedCanvas);
                return {
                    text: result.data.text,
                    confidence: result.data.confidence,
                    lines: result.data.lines || [],
                    words: result.data.words || [],
                };
            }

            // ==================== PDF处理 ====================
            async function processPDF(pdfFile) {
                const arrayBuffer = await pdfFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdf.numPages;
                const pagesData = [];

                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 }); // 2倍缩放提高清晰度
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.min(viewport.width, 2400);
                    canvas.height = Math.min(viewport.height, 3200);
                    const scale = Math.min(canvas.width / viewport.width, canvas.height / viewport.height);
                    const adjustedViewport = page.getViewport({ scale: scale * 2.0 });

                    canvas.width = Math.floor(adjustedViewport.width);
                    canvas.height = Math.floor(adjustedViewport.height);

                    const ctx = canvas.getContext('2d');
                    await page.render({
                        canvasContext: ctx,
                        viewport: adjustedViewport,
                    }).promise;

                    pagesData.push({
                        pageNum,
                        canvas,
                        imageDataUrl: canvas.toDataURL('image/png'),
                    });
                }
                return pagesData;
            }

            // ==================== 解析OCR结果 ====================
            function parseLotteryNumbers(ocrResult) {
                const text = ocrResult.text;
                const lines = ocrResult.lines || [];
                const words = ocrResult.words || [];

                // 按y坐标排序行
                const sortedLines = [...lines].sort((a, b) => {
                    const ay = a.bbox ? a.bbox.y0 : 0;
                    const by = b.bbox ? b.bbox.y0 : 0;
                    return ay - by;
                });

                const results = []; // 每组: { redBalls:[], type:'single'|'multiple'|'dantuo', danBalls:[], tuoBalls:[], multiplier:1,
                // rawLine:'' }

                // 策略1：按行分析
                for (const line of sortedLines) {
                    const lineText = line.text || '';
                    const lineY = line.bbox ? line.bbox.y0 : 0;
                    const parsed = parseLine(lineText, lineY);
                    if (parsed) {
                        results.push(parsed);
                    }
                }

                // 策略2：如果按行没找到足够结果，从整体文本中提取
                if (results.length === 0) {
                    const globalParsed = parseFullText(text);
                    if (globalParsed.length > 0) {
                        results.push(...globalParsed);
                    }
                }

                // 策略3：使用word级别信息按y坐标聚类
                if (results.length === 0 && words.length > 0) {
                    const clustered = clusterWordsByY(words);
                    for (const cluster of clustered) {
                        const clusterText = cluster.map(w => w.text || '').join(' ');
                        const parsed = parseLine(clusterText, cluster[0]?.bbox?.y0 || 0);
                        if (parsed) {
                            results.push(parsed);
                        }
                    }
                }

                // 去重（相同红球组合只保留一个，但保留不同倍数）
                const uniqueResults = [];
                const seen = new Set();
                for (const r of results) {
                    const key = r.redBalls.join(',') + '|' + r.type + '|' + (r.danBalls || []).join(',') + '|' + (r
                        .tuoBalls || []).join(',');
                    if (!seen.has(key)) {
                        seen.add(key);
                        uniqueResults.push(r);
                    } else {
                        // 如果已存在，累加倍数
                        const existing = uniqueResults.find(x => {
                            const xkey = x.redBalls.join(',') + '|' + x.type + '|' + (x.danBalls || []).join(
                                ',') + '|' + (x.tuoBalls || []).join(',');
                            return xkey === key;
                        });
                        if (existing) {
                            existing.multiplier += r.multiplier;
                        }
                    }
                }

                return uniqueResults;
            }

            function parseLine(lineText, lineY) {
                if (!lineText || lineText.trim().length === 0) return null;
                const cleaned = lineText.replace(/\s+/g, ' ').trim();

                // 检测胆拖
                const dantuoMatch = detectDanTuo(cleaned);
                if (dantuoMatch) {
                    return dantuoMatch;
                }

                // 提取所有数字（考虑可能的分隔符）
                const allNumbers = extractNumbers(cleaned);

                // 过滤红球范围内的数字
                const redCandidates = allNumbers.filter(n => isRedBall(n));

                if (redCandidates.length >= 5 && redCandidates.length <= 20) {
                    // 可能是红球号码组
                    const multiplier = detectMultiplier(cleaned, allNumbers, redCandidates);
                    const type = redCandidates.length === 6 ? 'single' : 'multiple';

                    return {
                        redBalls: redCandidates.map(n => padZero(n)),
                        type: type,
                        danBalls: null,
                        tuoBalls: null,
                        multiplier: multiplier,
                        rawLine: cleaned,
                        lineY: lineY,
                    };
                }

                // 如果红球候选少于5个，可能是部分识别，尝试从行中提取
                if (redCandidates.length >= 3 && redCandidates.length < 5) {
                    const multiplier = detectMultiplier(cleaned, allNumbers, redCandidates);
                    return {
                        redBalls: redCandidates.map(n => padZero(n)),
                        type: 'partial',
                        danBalls: null,
                        tuoBalls: null,
                        multiplier: multiplier,
                        rawLine: cleaned,
                        lineY: lineY,
                    };
                }

                return null;
            }

            function parseFullText(fullText) {
                const results = [];
                const cleaned = fullText.replace(/\s+/g, ' ').trim();

                // 查找胆拖模式
                const dantuoResult = detectDanTuo(cleaned);
                if (dantuoResult) {
                    results.push(dantuoResult);
                    return results;
                }

                // 提取所有数字序列
                const numberSequences = extractNumberSequences(cleaned);
                for (const seq of numberSequences) {
                    const redCandidates = seq.filter(n => isRedBall(n));
                    if (redCandidates.length >= 5 && redCandidates.length <= 20) {
                        const multiplier = detectMultiplierFromSeq(cleaned, seq);
                        results.push({
                            redBalls: redCandidates.map(n => padZero(n)),
                            type: redCandidates.length === 6 ? 'single' : 'multiple',
                            danBalls: null,
                            tuoBalls: null,
                            multiplier: multiplier,
                            rawLine: seq.join(','),
                            lineY: 0,
                        });
                    }
                }

                return results;
            }

            function detectDanTuo(text) {
                // 检测胆拖模式：胆:xx,xx 拖:xx,xx 或 胆码:xx 拖码:xx
                const danPatterns = [
                    /胆[码\s]*[：:]\s*([\d\s,，、]+)/i,
                    /胆[：:]\s*([\d\s,，、]+)/i,
                    /\(胆\)\s*([\d\s,，、]+)/i,
                ];
                const tuoPatterns = [
                    /拖[码\s]*[：:]\s*([\d\s,，、]+)/i,
                    /拖[：:]\s*([\d\s,，、]+)/i,
                    /\(拖\)\s*([\d\s,，、]+)/i,
                ];

                let danBalls = null;
                let tuoBalls = null;

                for (const pat of danPatterns) {
                    const m = text.match(pat);
                    if (m) {
                        danBalls = extractNumbers(m[1]).filter(n => isRedBall(n)).map(n => padZero(n));
                        break;
                    }
                }
                for (const pat of tuoPatterns) {
                    const m = text.match(pat);
                    if (m) {
                        tuoBalls = extractNumbers(m[1]).filter(n => isRedBall(n)).map(n => padZero(n));
                        break;
                    }
                }

                if (danBalls && danBalls.length > 0 && tuoBalls && tuoBalls.length > 0) {
                    const allNums = extractNumbers(text);
                    const multiplier = detectMultiplierGeneric(text, allNums);
                    return {
                        redBalls: [...danBalls, ...tuoBalls],
                        type: 'dantuo',
                        danBalls: danBalls,
                        tuoBalls: tuoBalls,
                        multiplier: multiplier,
                        rawLine: text,
                        lineY: 0,
                    };
                }
                return null;
            }

            function extractNumbers(text) {
                // 从文本中提取所有数字（支持各种分隔符）
                const nums = [];
                // 匹配数字（包括小数但只取整数部分）
                const matches = text.match(/\d+/g);
                if (matches) {
                    for (const m of matches) {
                        const n = parseInt(m, 10);
                        if (!isNaN(n) && n > 0 && n < 100) {
                            nums.push(n);
                        }
                    }
                }
                return nums;
            }

            function extractNumberSequences(text) {
                // 提取连续的数字序列（被非数字分隔符分隔）
                const sequences = [];
                const parts = text.split(/[^\d]+/);
                let currentSeq = [];
                for (const part of parts) {
                    const n = parseInt(part, 10);
                    if (!isNaN(n) && n > 0 && n < 100) {
                        currentSeq.push(n);
                    } else if (currentSeq.length > 0) {
                        if (currentSeq.length >= 5) sequences.push([...currentSeq]);
                        currentSeq = [];
                    }
                }
                if (currentSeq.length >= 5) sequences.push([...currentSeq]);
                return sequences;
            }

            function detectMultiplier(lineText, allNumbers, redCandidates) {
                // 在红球候选之外查找倍数
                const otherNums = allNumbers.filter(n => !redCandidates.includes(n));

                // 查找括号中的数字
                const bracketPatterns = [
                    /[\(（]\s*(\d{1,3})\s*[\)）]/g,
                    /[\【\[]\s*(\d{1,3})\s*[\】\]]/g,
                    /[\[【]\s*(\d{1,3})\s*[\]】]/g,
                ];
                for (const pat of bracketPatterns) {
                    let m;
                    while ((m = pat.exec(lineText)) !== null) {
                        const val = parseInt(m[1], 10);
                        if (val >= 2 && val <= 200 && val !== 0) {
                            return val;
                        }
                    }
                }

                // 查找"倍数"关键字
                const倍Match = lineText.match(/倍[数]?\s*[：:]*\s*(\d{1,3})/i);
                if (倍Match) {
                    const val = parseInt(倍Match[1], 10);
                    if (val >= 2 && val <= 200) return val;
                }

                // 查找数字后跟"倍"
                const numBeiMatch = lineText.match(/(\d{1,3})\s*倍/);
                if (numBeiMatch) {
                    const val = parseInt(numBeiMatch[1], 10);
                    if (val >= 2 && val <= 200) return val;
                }

                // 在其他数字中查找可能的倍数（较大的数字，如22、50等）
                for (const n of otherNums) {
                    if (n >= 2 && n <= 200 && n !== 16 && n !== 33) {
                        // 排除常见的蓝球号码
                        if (n > 33 || (n > 16 && n <= 200)) {
                            return n;
                        }
                    }
                }

                return 1;
            }

            function detectMultiplierFromSeq(fullText, seq) {
                const allNums = extractNumbers(fullText);
                const seqSet = new Set(seq);
                const otherNums = allNums.filter(n => !seqSet.has(n));
                return detectMultiplierGeneric(fullText, allNums);
            }

            function detectMultiplierGeneric(text, allNums) {
                const bracketPatterns = [
                    /[\(（]\s*(\d{1,3})\s*[\)）]/g,
                    /[\【\[]\s*(\d{1,3})\s*[\】\]]/g,
                ];
                for (const pat of bracketPatterns) {
                    let m;
                    while ((m = pat.exec(text)) !== null) {
                        const val = parseInt(m[1], 10);
                        if (val >= 2 && val <= 200) return val;
                    }
                }
                const倍Match = text.match(/倍[数]?\s*[：:]*\s*(\d{1,3})/i);
                if (倍Match) {
                    const val = parseInt(倍Match[1], 10);
                    if (val >= 2 && val <= 200) return val;
                }
                const numBeiMatch = text.match(/(\d{1,3})\s*倍/);
                if (numBeiMatch) {
                    const val = parseInt(numBeiMatch[1], 10);
                    if (val >= 2 && val <= 200) return val;
                }
                return 1;
            }

            function clusterWordsByY(words) {
                if (words.length === 0) return [];
                const sorted = [...words].sort((a, b) => (a.bbox?.y0 || 0) - (b.bbox?.y0 || 0));
                const clusters = [];
                let currentCluster = [sorted[0]];
                let currentY = sorted[0].bbox?.y0 || 0;

                for (let i = 1; i < sorted.length; i++) {
                    const wy = sorted[i].bbox?.y0 || 0;
                    if (Math.abs(wy - currentY) < 40) {
                        // 同一行
                        currentCluster.push(sorted[i]);
                    } else if (Math.abs(wy - currentY) < 120) {
                        // 可能同一组（多行）
                        currentCluster.push(sorted[i]);
                        currentY = wy;
                    } else {
                        // 新组
                        if (currentCluster.length >= 3) {
                            clusters.push([...currentCluster]);
                        }
                        currentCluster = [sorted[i]];
                        currentY = wy;
                    }
                }
                if (currentCluster.length >= 3) {
                    clusters.push([...currentCluster]);
                }
                return clusters;
            }

            // ==================== 格式化输出 ====================
            function formatOutput(parsedResults) {
                const lines = [];
                for (const result of parsedResults) {
                    const multiplier = Math.max(1, Math.min(result.multiplier || 1, 200));
                    let lineText;
                    if (result.type === 'dantuo' && result.danBalls && result.tuoBalls) {
                        lineText = '胆:' + result.danBalls.join(',') + '，拖:' + result.tuoBalls.join(',');
                    } else {
                        lineText = result.redBalls.join(',');
                    }
                    // 按倍数输出
                    for (let i = 0; i < multiplier; i++) {
                        lines.push(lineText);
                    }
                }
                return lines.join('\n');
            }

            // ==================== 主处理流程 ====================
            async function processAllFiles() {
                if (isProcessing) return;
                if (allFiles.length === 0) {
                    showToast('⚠️ 请先上传文件');
                    return;
                }
                if (!tesseractReady) {
                    showToast('⏳ OCR引擎尚未就绪，请稍候...');
                    await initTesseract();
                    if (!tesseractReady) {
                        showToast('❌ OCR引擎加载失败');
                        return;
                    }
                }

                isProcessing = true;
                abortController = new AbortController();
                const signal = abortController.signal;
                updateUI();
                btnStartRecognition.disabled = true;
                btnStartRecognition.textContent = '⏳ 识别中...';
                progressWrap.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = '准备处理...';
                resetOutput();

                // 计算总处理单元
                totalToProcess = 0;
                for (const f of allFiles) {
                    if (f.type === 'pdf') {
                        // PDF需要先解析页数
                        totalToProcess += 0; // 稍后动态更新
                    } else {
                        totalToProcess += 1;
                    }
                }
                // 先假设PDF有若干页，后续更新
                let pdfTotalPages = 0;
                const pdfFileObj = allFiles.find(f => f.type === 'pdf');
                if (pdfFileObj) {
                    try {
                        const pdfData = await processPDF(pdfFileObj.file);
                        pdfFileObj.pdfPages = pdfData;
                        pdfTotalPages = pdfData.length;
                        pdfFileObj.status = 'pending';
                    } catch (err) {
                        console.error('PDF解析失败:', err);
                        pdfFileObj.status = 'error';
                        pdfFileObj.resultText = '[PDF解析失败]';
                        showToast('❌ PDF解析失败，请检查文件');
                    }
                }
                totalToProcess = allFiles.filter(f => f.type === 'image').length + pdfTotalPages;
                processedCount = 0;

                if (totalToProcess === 0) {
                    showToast('⚠️ 没有可处理的文件');
                    finishProcessing();
                    return;
                }

                progressText.textContent = `0 / ${totalToProcess} 完成`;

                const allOutputLines = [];
                const fileResults = []; // 按文件顺序存储结果

                // 处理每个文件
                for (let fileIdx = 0; fileIdx < allFiles.length; fileIdx++) {
                    if (signal.aborted) break;
                    const fileObj = allFiles[fileIdx];

                    if (fileObj.type === 'image') {
                        fileObj.status = 'processing';
                        renderFileList();
                        updateProgress();

                        try {
                            const img = await loadImage(fileObj.previewUrl);
                            const ocrResult = await ocrImage(img);
                            const parsed = parseLotteryNumbers(ocrResult);
                            const formatted = formatOutput(parsed);
                            fileObj.resultText = formatted;
                            fileObj.status = 'done';
                            if (formatted) allOutputLines.push(formatted);
                            fileResults.push({ name: fileObj.file.name, text: formatted, parsed: parsed });
                        } catch (err) {
                            console.error(`识别失败: ${fileObj.file.name}`, err);
                            fileObj.status = 'error';
                            fileObj.resultText = `[识别失败: ${err.message}]`;
                            fileResults.push({ name: fileObj.file.name, text: '', parsed: [], error: true });
                        }
                        processedCount++;
                        updateProgress();
                        renderFileList();

                    } else if (fileObj.type === 'pdf' && fileObj.pdfPages) {
                        const pdfPages = fileObj.pdfPages;
                        fileObj.status = 'processing';
                        renderFileList();
                        updateProgress();

                        for (let pageIdx = 0; pageIdx < pdfPages.length; pageIdx++) {
                            if (signal.aborted) break;
                            const pageData = pdfPages[pageIdx];
                            try {
                                const img = await loadImageFromDataUrl(pageData.imageDataUrl);
                                const ocrResult = await ocrImage(img);
                                const parsed = parseLotteryNumbers(ocrResult);
                                const formatted = formatOutput(parsed);
                                if (formatted) allOutputLines.push(formatted);
                                fileResults.push({
                                    name: `${fileObj.file.name} - 第${pageData.pageNum}页`,
                                    text: formatted,
                                    parsed: parsed,
                                });
                            } catch (err) {
                                console.error(`PDF第${pageData.pageNum}页识别失败:`, err);
                                fileResults.push({
                                    name: `${fileObj.file.name} - 第${pageData.pageNum}页`,
                                    text: '',
                                    parsed: [],
                                    error: true,
                                });
                            }
                            processedCount++;
                            updateProgress();
                            renderFileList();
                        }
                        fileObj.status = 'done';
                        renderFileList();
                    }
                }

                // 汇总输出
                const finalOutput = allOutputLines.join('\n');
                outputArea.value = finalOutput;
                if (finalOutput.trim()) {
                    resultStats.textContent = `识别完成 · ${allOutputLines.length} 行`;
                    btnCopy.disabled = false;
                    btnDownload.disabled = false;
                    outputStats.textContent = `共 ${allOutputLines.length} 行号码（含倍数展开）`;
                } else {
                    resultStats.textContent = '未识别到号码';
                    outputStats.textContent = '请检查图片质量或手动输入';
                }

                finishProcessing();
            }

            function loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = src;
                });
            }

            function loadImageFromDataUrl(dataUrl) {
                return loadImage(dataUrl);
            }

            function updateProgress() {
                if (totalToProcess === 0) return;
                const pct = Math.round((processedCount / totalToProcess) * 100);
                progressBar.style.width = pct + '%';
                progressText.textContent = `${processedCount} / ${totalToProcess} 完成 (${pct}%)`;
            }

            function finishProcessing() {
                isProcessing = false;
                abortController = null;
                btnStartRecognition.disabled = false;
                btnStartRecognition.textContent = '🔍 开始识别';
                updateUI();
                if (processedCount >= totalToProcess && totalToProcess > 0) {
                    progressBar.style.width = '100%';
                    progressText.textContent = `全部完成！共处理 ${totalToProcess} 个单元`;
                }
            }

            // ==================== 按钮事件 ====================
            btnStartRecognition.addEventListener('click', async () => {
                if (isProcessing) return;
                await processAllFiles();
            });

            btnCopy.addEventListener('click', () => {
                const text = outputArea.value;
                if (!text.trim()) {
                    showToast('⚠️ 没有可复制的内容');
                    return;
                }
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ 已复制到剪贴板！');
                }).catch(() => {
                    // 降级方案
                    outputArea.select();
                    document.execCommand('copy');
                    showToast('✅ 已复制到剪贴板！');
                });
            });

            btnDownload.addEventListener('click', () => {
                const text = outputArea.value;
                if (!text.trim()) {
                    showToast('⚠️ 没有可下载的内容');
                    return;
                }
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '双色球红球识别结果_' + new Date().toISOString().slice(0, 10) + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ 下载完成！');
            });

            // ==================== 初始化 ====================
            updateUI();
            renderFileList();

            // 页面加载时预初始化OCR
            setTimeout(() => {
                initTesseract().catch(() => {
                    workerHint.textContent = '⚠️ OCR引擎加载失败，点击开始识别时会重试';
                    workerHint.style.color = 'var(--danger)';
                });
            }, 500);

            // ==================== 键盘快捷键 ====================
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !isProcessing && allFiles.length > 0) {
                    e.preventDefault();
                    processAllFiles();
                }
            });

            console.log('🎱 双色球彩票红球识别工具已就绪');
            console.log('   - 支持图片和PDF上传');
            console.log('   - 使用Tesseract.js进行OCR识别');
            console.log('   - 自动识别单式、复式、胆拖');
            console.log('   - 自动识别倍数并展开输出');
            console.log('   - 数字1-9自动补零为01-09');
            console.log('   💡 提示：Ctrl+Enter 快速开始识别');
        })();
    </script>
</body>
