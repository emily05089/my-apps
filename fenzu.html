<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胆拖码组合生成器 · 无格式限制</title>
    <style>
        :root {
            --primary: #4A6CF7;
            --primary-dark: #3651d5;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #5a6c7d;
            --border: #dde4ed;
            --shadow: 0 8px 32px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8edf5, #dce3ed);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            color: var(--text);
        }
        .app-container {
            width: 100%; max-width: 700px; background: var(--card-bg);
            border-radius: 20px; box-shadow: var(--shadow); padding: 36px 30px;
        }
        .app-header { text-align: center; margin-bottom: 24px; }
        .app-header h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .app-header p { color: var(--text-light); margin-top: 6px; }
        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem;
        }
        .input-group textarea {
            width: 100%; min-height: 140px; padding: 14px; border: 2px solid var(--border);
            border-radius: var(--radius-sm); font-family: 'Consolas', 'Monaco', 'PingFang SC', monospace;
            font-size: 0.95rem; background: #fafbfd; resize: vertical; outline: none;
            transition: border-color var(--transition);
        }
        .input-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(74,108,247,0.08); }
        .hint { font-size: 0.78rem; color: #888; margin-top: 6px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px;
            border: none; border-radius: 50px; font-weight: 600; cursor: pointer;
            transition: all var(--transition); font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(74,108,247,0.3); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); margin-right: 10px; }
        .results { margin-top: 24px; display: none; }
        .results.visible { display: block; animation: fadeIn 0.3s; }
        .stats { display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap; }
        .stat-item {
            flex: 1; min-width: 100px; background: #f8fafd; border-radius: 10px;
            padding: 14px; text-align: center; border: 1px solid var(--border);
        }
        .stat-item strong { display: block; font-size: 1.6rem; color: var(--primary); }
        .stat-item span { font-size: 0.8rem; color: var(--text-light); }
        .combo-list {
            max-height: 400px; overflow-y: auto; border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; background: #fafbfd;
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .combo-tag {
            background: #fff; border: 1px solid #d0dae6; border-radius: 20px;
            padding: 4px 12px; font-family: monospace; font-size: 0.85rem; color: var(--text);
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
            background: #333; color: #fff; padding: 12px 24px; border-radius: 50px;
            font-weight: 500; z-index: 2000; transition: transform 0.3s; pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>🎯 胆拖码组合生成器</h1>
        <p>无格式限制 · 自动识别 · 生成所有6码组合</p>
    </div>

    <div class="input-group">
        <label>输入胆拖码（支持任意格式）</label>
        <textarea id="inputArea" placeholder="示例：
胆:16,18,23,29
拖:04,05,08,11,19,22,26,27,33

或单行：胆：16,18,23,29 拖：04,05,08,11,19,22,26,27,33
或中文逗号：胆：16，18，23，29 拖：04，05，08，11，19，22，26，27，33"></textarea>
        <div class="hint">✅ 支持中文/英文冒号、有无空格、中英文逗号、多行/单行混用</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn btn-primary" onclick="generateCombos()">🔍 生成组合</button>
        <button class="btn btn-outline" onclick="clearAll()">🗑 清空</button>
    </div>

    <div class="results" id="resultsArea">
        <div class="stats" id="statsArea"></div>
        <div style="margin-bottom:10px; display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size:0.9rem;">📋 生成的组合列表</strong>
            <button class="btn btn-outline" style="padding:6px 14px; font-size:0.8rem;" onclick="copyCombos()">📋 复制全部</button>
        </div>
        <div class="combo-list" id="comboList"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        const inputArea = document.getElementById('inputArea');
        const resultsArea = document.getElementById('resultsArea');
        const statsArea = document.getElementById('statsArea');
        const comboList = document.getElementById('comboList');
        const toast = document.getElementById('toast');

        let generatedCombos = []; // 存储当前生成的组合（字符串数组）

        // 显示提示
        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // 解析数字列表（处理各种逗号、空格）
        function parseNumberList(str) {
            if (!str) return [];
            // 统一替换中文逗号为英文逗号
            let cleaned = str.replace(/，/g, ',');
            // 按逗号分割
            return cleaned.split(',')
                .map(s => s.trim())
                .filter(s => s !== '')
                .map(s => {
                    // 去除可能的前导零再解析，但保留值
                    let num = parseInt(s, 10);
                    return isNaN(num) ? null : num;
                })
                .filter(n => n !== null);
        }

        // 解析胆拖文本
        function parseInput(text) {
            // 将全角冒号替换为半角
            text = text.replace(/：/g, ':');
            // 将多个空格/换行统一处理，但保留行结构
            let lines = text.split(/\r?\n/);
            let danNumbers = [];
            let tuoNumbers = [];
            let foundDan = false, foundTuo = false;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // 尝试匹配 “胆:...” 或 “胆 ...”
                let danMatch = line.match(/胆\s*[:：]\s*(.+)/i) || line.match(/胆\s+(.+)/i);
                if (danMatch) {
                    danNumbers = danNumbers.concat(parseNumberList(danMatch[1]));
                    foundDan = true;
                    continue;
                }

                // 尝试匹配 “拖:...” 或 “拖 ...”
                let tuoMatch = line.match(/拖\s*[:：]\s*(.+)/i) || line.match(/拖\s+(.+)/i);
                if (tuoMatch) {
                    tuoNumbers = tuoNumbers.concat(parseNumberList(tuoMatch[1]));
                    foundTuo = true;
                    continue;
                }

                // 如果一行中同时包含胆和拖（如“胆:... 拖:...”），额外处理
                let combinedDan = line.match(/胆\s*[:：]\s*(.+?)(?=\s+拖|\s*$)/i);
                let combinedTuo = line.match(/拖\s*[:：]\s*(.+)/i);
                if (combinedDan && combinedTuo) {
                    danNumbers = danNumbers.concat(parseNumberList(combinedDan[1]));
                    tuoNumbers = tuoNumbers.concat(parseNumberList(combinedTuo[1]));
                    foundDan = true;
                    foundTuo = true;
                    continue;
                }

                // 如果仍未匹配，可能是纯数字行（没有标签），作为拖码（或胆码）的补充？这里忽略未知行，但可提示。
                // 为了最大兼容，如果前面没有找到胆拖，则尝试作为拖码处理。
                if (!foundDan && !foundTuo) {
                    // 整行都是数字的情况？假设用户可能只写了数字而没有标签，我们推测是拖码（胆码可能已在别处）
                    let nums = parseNumberList(line);
                    if (nums.length > 0) {
                        tuoNumbers = tuoNumbers.concat(nums);
                    }
                }
            }

            // 去重
            danNumbers = [...new Set(danNumbers)];
            tuoNumbers = [...new Set(tuoNumbers)];

            return { dan: danNumbers, tuo: tuoNumbers, foundDan, foundTuo };
        }

        // 生成组合（C(n,k)）
        function getCombinations(arr, k) {
            if (k === 0) return [[]];
            if (arr.length < k) return [];
            if (arr.length === k) return [arr.slice()];

            let result = [];
            let head = arr[0];
            let rest = arr.slice(1);

            // 包含head的组合
            for (let combo of getCombinations(rest, k - 1)) {
                result.push([head, ...combo]);
            }
            // 不包含head的组合
            for (let combo of getCombinations(rest, k)) {
                result.push(combo);
            }
            return result;
        }

        // 主生成函数
        window.generateCombos = function() {
            const rawText = inputArea.value;
            if (!rawText.trim()) {
                showToast('⚠️ 请输入胆拖码内容', 'warning');
                return;
            }

            const { dan, tuo, foundDan, foundTuo } = parseInput(rawText);

            if (!foundDan && !foundTuo) {
                showToast('⚠️ 未识别到“胆”或“拖”关键字，请检查格式', 'warning');
                return;
            }
            if (dan.length === 0 && tuo.length === 0) {
                showToast('⚠️ 胆码和拖码均为空，请检查数字部分', 'warning');
                return;
            }

            // 假设需要生成6个数字的组合（可根据需要调整）
            const TARGET = 6;
            const danLen = dan.length;

            if (danLen > TARGET) {
                showToast('⚠️ 胆码数量超过6个，无法生成组合', 'warning');
                return;
            }

            const needFromTuo = TARGET - danLen;
            if (needFromTuo > tuo.length) {
                showToast(`⚠️ 拖码数量不足：需要从拖码中选${needFromTuo}个，但拖码只有${tuo.length}个`, 'warning');
                return;
            }

            // 从拖码中选出 needFromTuo 个的组合
            const tuoCombos = needFromTuo === 0 ? [[]] : getCombinations(tuo, needFromTuo);

            // 生成最终组合（胆码 + 拖码组合），并排序、补零
            generatedCombos = tuoCombos.map(tc => {
                let full = [...dan, ...tc].sort((a, b) => a - b);
                return full.map(n => String(n).padStart(2, '0')).join(',');
            });

            // 显示结果
            displayResults(dan, tuo, generatedCombos);
        };

        function displayResults(dan, tuo, combos) {
            // 统计
            statsArea.innerHTML = `
                <div class="stat-item"><strong>${dan.length}</strong><span>胆码个数</span></div>
                <div class="stat-item"><strong>${tuo.length}</strong><span>拖码个数</span></div>
                <div class="stat-item"><strong>${combos.length}</strong><span>生成组合数</span></div>
            `;

            // 组合列表
            comboList.innerHTML = combos.map(c => `<span class="combo-tag">${c}</span>`).join('');

            resultsArea.classList.add('visible');
            if (combos.length > 0) {
                showToast(`✅ 成功生成 ${combos.length} 组组合`, 'success');
            }
        }

        // 复制全部组合
        window.copyCombos = function() {
            if (generatedCombos.length === 0) {
                showToast('⚠️ 没有可复制的组合', 'warning');
                return;
            }
            const text = generatedCombos.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 已复制全部组合到剪贴板', 'success');
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('📋 已复制（兼容模式）', 'success');
            });
        };

        // 清空
        window.clearAll = function() {
            inputArea.value = '';
            resultsArea.classList.remove('visible');
            generatedCombos = [];
            statsArea.innerHTML = '';
            comboList.innerHTML = '';
        };

        // 示例填充（可选）
        // 页面加载时可预填示例，方便测试
        inputArea.value = `胆:16,18,23,29
拖:04,05,08,11,19,22,26,27,33`;
    })();
</script>
</body>
</html>
