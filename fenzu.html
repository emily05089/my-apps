<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>双分组</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4f8;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 960px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.1);
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0a2a40;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #e8eef4;
      padding-bottom: 16px;
    }
    h1 .icon {
      background: linear-gradient(135deg, #c62828, #b71c1c);
      color: white;
      font-size: 1.3rem;
      padding: 4px 16px;
      border-radius: 30px;
    }
    .input-area { display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: 600; color: #1a3a52; font-size: 0.95rem; }
    textarea {
      width: 100%;
      height: 220px;
      border: 2px solid #dce3ec;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      font-family: 'Fira Code', 'Courier New', monospace;
      background: #fafbfd;
      resize: vertical;
      transition: 0.2s;
      color: #152b3c;
    }
    textarea:focus {
      outline: none;
      border-color: #1565c0;
      box-shadow: 0 0 0 4px rgba(21, 101, 192, 0.12);
      background: white;
    }
    .hint {
      font-size: 0.82rem;
      color: #5d6f82;
      background: #f0f4fa;
      padding: 8px 14px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .hint code {
      background: #dfe6f0;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8rem;
    }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      padding: 11px 26px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      background: #eef2f7;
      color: #1e3b5a;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #0b2b44;
      color: white;
      box-shadow: 0 4px 12px rgba(11, 43, 68, 0.25);
    }
    .btn-primary:hover { background: #123c5a; }
    .btn:hover { background: #dfe6f0; }
    .results { display: flex; flex-direction: column; gap: 16px; margin-top: 4px; }
    .total-box {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      border-radius: 16px;
      padding: 16px 20px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #2e7d32;
    }
    .group-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .group-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #0b2b44;
      background: #eef3fa;
      padding: 5px 16px;
      border-radius: 24px;
    }
    .badge {
      background: #c62828;
      color: white;
      border-radius: 16px;
      padding: 2px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 6px;
    }
    .copy-btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e405b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }
    .copy-btn:hover { background: #e8eef6; border-color: #94a3b8; }
    .copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .copy-btn.copied { background: #dcfce7; border-color: #86efac; color: #166534; }
    .combo-list {
      background: #f8fafd;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1a3244;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ebf0f7;
      line-height: 1.7;
      min-height: 36px;
    }
    .empty { color: #8899aa; font-style: italic; }
    .error-box {
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-left: 4px solid #c62828;
      padding: 12px 16px;
      border-radius: 12px;
      color: #7f1d1d;
      font-size: 0.85rem;
      margin-bottom: 6px;
      max-height: 400px;
      overflow-y: auto;
    }
    .error-box summary {
      cursor: pointer;
      font-weight: 700;
      margin-bottom: 8px;
      color: #991b1b;
    }
    .error-item {
      background: #fef2f2;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      border-left: 3px solid #ef4444;
    }
    .error-line { font-weight: 700; color: #b91c1c; }
    .error-reason { color: #7f1d1d; margin-left: 6px; }
    @media (max-width: 600px) {
      .container { padding: 16px; }
      .btn { padding: 10px 18px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>
    🎱 双分组
    <span class="icon">11组分类·拆分统计</span>
  </h1>

  <div class="input-area">
    <label>📋 输入组合（支持篮球，胆拖必须带“拖”字）</label>
    <textarea id="comboInput" placeholder="单式：1,2,3,4,5,6-8
复式：1,2,3,4,5,6,7,8-1
胆拖：胆:04,07,16,27 拖:05,08,14,15,20,30-1
..."></textarea>
    <div class="hint">
      <span>✅ 蓝球后用 <code>-</code> 分隔</span>
      <span>✅ 胆拖必须含“拖”字</span>
      <span>⚠️ 自动拆分为6数字组合并统计总数</span>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="groupBtn">📊 确定并分组</button>
    <button class="btn" id="clearBtn">🗑️ 清空</button>
    <button class="btn" id="demoBtn">✨ 加载示例</button>
  </div>

  <div id="resultsContainer" class="results"></div>
</div>

<script>
(function() {
  const GROUP_DEFS = [
    { id: 'g1', label: '单式/复式：6个数字的组合', test: (item) => item.type === 'standard' && item.count === 6 },
    { id: 'g2', label: '单式/复式：7、8、9个数字的组合', test: (item) => item.type === 'standard' && item.count >= 7 && item.count <= 9 },
    { id: 'g3', label: '单式/复式：10-14个数字的组合', test: (item) => item.type === 'standard' && item.count >= 10 && item.count <= 14 },
    { id: 'g4', label: '单式/复式：15个数字及以上的组合', test: (item) => item.type === 'standard' && item.count >= 15 },
    { id: 'g5', label: '胆拖形式：4个胆、5个胆的组合', test: (item) => item.type === 'dantuo' && (item.danCount === 4 || item.danCount === 5) },
    { id: 'g6', label: '胆拖形式：其他胆拖（1到3个胆）组合', test: (item) => item.type === 'dantuo' && item.danCount >= 1 && item.danCount <= 3 },
    { id: 'g10', label: '单式/复式：10个数字的组合', test: (item) => item.type === 'standard' && item.count === 10 },
    { id: 'g11', label: '单式/复式：11个数字的组合', test: (item) => item.type === 'standard' && item.count === 11 },
    { id: 'g12', label: '单式/复式：12个数字的组合', test: (item) => item.type === 'standard' && item.count === 12 },
    { id: 'g13', label: '单式/复式：13个数字的组合', test: (item) => item.type === 'standard' && item.count === 13 },
    { id: 'g14', label: '单式/复式：14个数字的组合', test: (item) => item.type === 'standard' && item.count === 14 }
  ];

  function extractNums(str) {
    const cleaned = str.replace(/\./g, ',').replace(/，/g, ',').replace(/\s+/g, ',').replace(/,+/g, ',');
    const parts = cleaned.split(',');
    const nums = [];
    const invalidNums = [];
    for (let p of parts) {
      const v = p.trim();
      if (!v) continue;
      const n = Number(v);
      if (!isNaN(n) && Number.isInteger(n)) {
        if (n >= 1 && n <= 33) nums.push(n);
        else invalidNums.push(n);
      }
    }
    return { nums, invalidNums };
  }

  function splitBlue(line) {
    const trimmed = line.trim();
    const lastDash = trimmed.lastIndexOf('-');
    if (lastDash === -1) return { redPart: trimmed, blue: null };
    const redPart = trimmed.substring(0, lastDash).trim();
    const blueStr = trimmed.substring(lastDash + 1).trim();
    if (/^\d+$/.test(blueStr)) {
      const blueNum = parseInt(blueStr, 10);
      if (blueNum >= 1 && blueNum <= 16) {
        return { redPart, blue: blueNum };
      }
    }
    return { redPart: trimmed, blue: null };
  }

  function isDanLine(line) {
    const t = line.trim();
    return /胆\s*[:：]/i.test(t) && !/拖\s*[:：]/i.test(t);
  }
  function isTuoLine(line) {
    const t = line.trim();
    return /^拖\s*[:：]\s*\d/i.test(t) && !/胆/i.test(t);
  }
  function isDantuoSameLine(line) {
    const d = line.search(/胆\s*[:：]/i);
    const t = line.search(/拖\s*[:：]/i);
    return d !== -1 && t !== -1 && d < t;
  }

  function preprocessLines(rawLines) {
    const merged = [];
    let i = 0;
    while (i < rawLines.length) {
      const line = rawLines[i].trim();
      if (!line) { i++; continue; }
      if (isDantuoSameLine(line)) { merged.push(line); i++; continue; }
      if (isDanLine(line)) {
        let j = i + 1;
        while (j < rawLines.length && rawLines[j].trim() === '') j++;
        if (j < rawLines.length && isTuoLine(rawLines[j].trim())) {
          const tuoRaw = rawLines[j].trim();
          merged.push(line + ' ' + tuoRaw);
          i = j + 1;
        } else {
          merged.push(line);
          i++;
        }
        continue;
      }
      if (isTuoLine(line)) { merged.push(line); i++; continue; }
      merged.push(line);
      i++;
    }
    return merged;
  }

  function parseLine(line) {
    const trimmed = line.trim();
    if (!trimmed) return null;
    const { redPart, blue } = splitBlue(trimmed);
    const danIdx = redPart.search(/胆\s*[:：]/i);
    const tuoIdx = redPart.search(/拖\s*[:：]/i);

    if (danIdx !== -1 && tuoIdx !== -1 && danIdx < tuoIdx) {
      const danPart = redPart.substring(danIdx, tuoIdx).replace(/胆\s*[:：]\s*/i, '').trim();
      const tuoPart = redPart.substring(tuoIdx).replace(/拖\s*[:：]\s*/i, '').trim();
      return buildDantuoResult(trimmed, danPart, tuoPart, blue);
    } else if (danIdx !== -1 && tuoIdx === -1) {
      return { type: 'invalid', raw: trimmed, reason: '缺少拖码（必须包含“拖”字）' };
    } else if (danIdx === -1 && tuoIdx !== -1) {
      return { type: 'invalid', raw: trimmed, reason: '缺少胆码' };
    } else {
      const result = extractNums(redPart);
      if (result.invalidNums.length > 0) {
        return { type: 'invalid', raw: trimmed, reason: `超出1-33：[${result.invalidNums.join(',')}]` };
      }
      const nums = result.nums.sort((a,b)=>a-b);
      if (nums.length === 0) return { type: 'invalid', raw: trimmed, reason: '未识别到1-33的数字' };
      if (new Set(nums).size !== nums.length) return { type: 'invalid', raw: trimmed, reason: `数字重复：[${nums.join(',')}]` };
      if (nums.length < 6) return { type: 'invalid', raw: trimmed, reason: `只有${nums.length}个数字：[${nums.join(',')}]，至少需要6个` };
      return { type: 'standard', raw: trimmed, count: nums.length, nums, blue };
    }
  }

  function buildDantuoResult(raw, danPart, tuoPart, blue) {
    const danResult = extractNums(danPart);
    const tuoResult = extractNums(tuoPart);
    if (danResult.invalidNums.length > 0) return { type: 'invalid', raw, reason: `胆码超出1-33：[${danResult.invalidNums.join(',')}]` };
    if (tuoResult.invalidNums.length > 0) return { type: 'invalid', raw, reason: `拖码超出1-33：[${tuoResult.invalidNums.join(',')}]` };
    const danNums = danResult.nums.sort((a,b)=>a-b);
    const tuoNums = tuoResult.nums.sort((a,b)=>a-b);
    if (danNums.length < 1 || danNums.length > 5) return { type: 'invalid', raw, reason: `胆码数量必须1-5个，当前${danNums.length}个` };
    if (tuoNums.length < 2) return { type: 'invalid', raw, reason: `拖码至少需要2个，当前${tuoNums.length}个` };
    if (danNums.length + tuoNums.length < 6) return { type: 'invalid', raw, reason: `胆拖总数不足6个` };
    if (new Set(danNums).size !== danNums.length) return { type: 'invalid', raw, reason: `胆码重复：[${danNums.join(',')}]` };
    if (new Set(tuoNums).size !== tuoNums.length) return { type: 'invalid', raw, reason: `拖码重复：[${tuoNums.join(',')}]` };
    for (let n of danNums) if (tuoNums.includes(n)) return { type: 'invalid', raw, reason: `数字${n}在胆拖中重复` };
    return { type: 'dantuo', raw, danCount: danNums.length, tuoCount: tuoNums.length, danNums, tuoNums, blue };
  }

  // 组合生成器：从数组中选择k个
  function combinations(arr, k) {
    if (k === 0) return [[]];
    if (arr.length < k) return [];
    const result = [];
    const f = (start, chosen) => {
      if (chosen.length === k) {
        result.push([...chosen]);
        return;
      }
      for (let i = start; i <= arr.length - (k - chosen.length); i++) {
        chosen.push(arr[i]);
        f(i + 1, chosen);
        chosen.pop();
      }
    };
    f(0, []);
    return result;
  }

  function expandItem(item) {
    const result = [];
    if (item.type === 'standard') {
      if (item.count === 6) {
        result.push(formatCombo(item.nums, item.blue));
      } else {
        const combos = combinations(item.nums, 6);
        for (let c of combos) {
          result.push(formatCombo(c, item.blue));
        }
      }
    } else if (item.type === 'dantuo') {
      const need = 6 - item.danCount;
      const combos = combinations(item.tuoNums, need);
      for (let c of combos) {
        const full = [...item.danNums, ...c].sort((a,b)=>a-b);
        result.push(formatCombo(full, item.blue));
      }
    }
    return result;
  }

  function formatCombo(nums, blue) {
    const red = nums.map(n => String(n).padStart(2, '0')).join(',');
    return blue !== null ? `${red}-${String(blue).padStart(2, '0')}` : red;
  }

  function process() {
    const textarea = document.getElementById('comboInput');
    const rawLines = textarea.value.split(/\r?\n/);
    const mergedLines = preprocessLines(rawLines);
    const groups = GROUP_DEFS.map(g => ({ ...g, items: [] }));
    const errors = [];
    let totalCount = 0;

    for (let i = 0; i < mergedLines.length; i++) {
      const line = mergedLines[i];
      if (!line.trim()) continue;
      const parsed = parseLine(line);
      if (parsed.type === 'invalid') {
        errors.push({ lineNum: i + 1, reason: parsed.reason, raw: parsed.raw });
        continue;
      }

      // 展开为6数字组合
      const expanded = expandItem(parsed);
      totalCount += expanded.length;

      // 匹配分组，放入展开后的组合
      let anyMatched = false;
      for (let g of groups) {
        if (g.test(parsed)) {
          g.items.push(...expanded);
          anyMatched = true;
        }
      }
      if (!anyMatched) errors.push({ lineNum: i + 1, reason: '无法匹配任何分组', raw: parsed.raw });
    }

    render(groups, errors, totalCount);
  }

  function render(groups, errors, totalCount) {
    const container = document.getElementById('resultsContainer');
    let html = '';

    if (errors.length) {
      html += `<details class="error-box" open><summary>⚠️ ${errors.length} 行错误，已跳过（点击折叠）</summary>`;
      for (let err of errors) {
        html += `<div class="error-item"><span class="error-line">第${err.lineNum}行</span> <span class="error-reason">【${err.reason}】</span><br><span style="color:#991b1b;font-family:monospace;">原文：${escHtml(err.raw)}</span></div>`;
      }
      html += `</details>`;
    }

    html += `<div class="total-box">📊 一共生成了 <strong>${totalCount}</strong> 组6数字组合</div>`;

    const groupsData = {};
    for (let g of groups) groupsData[g.id] = g.items.join('\n');
    for (let g of groups) {
      const content = groupsData[g.id];
      const isEmpty = g.items.length === 0;
      html += `<div class="group-card"><div class="group-header"><span class="group-title">📌 ${escHtml(g.label)} <span class="badge">${g.items.length} 组</span></span><button class="copy-btn" data-group-id="${g.id}" ${isEmpty ? 'disabled' : ''}>📋 复制本组</button></div><div class="combo-list ${isEmpty ? 'empty' : ''}">${isEmpty ? '（暂无）' : escHtml(content)}</div></div>`;
    }
    container.innerHTML = html;

    container.querySelectorAll('.copy-btn[data-group-id]').forEach(btn => {
      btn.addEventListener('click', function() {
        const content = groupsData[this.getAttribute('data-group-id')] || '';
        if (!content || this.disabled) return;
        copyContent(content, this);
      });
    });
  }

  function copyContent(text, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showCopied(btn)).catch(() => fallbackCopy(text, btn));
    } else {
      fallbackCopy(text, btn);
    }
  }
  function fallbackCopy(text, btn) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try { document.execCommand('copy'); showCopied(btn); } catch (err) { alert('复制失败，请手动复制'); }
    document.body.removeChild(textarea);
  }
  function showCopied(btn) {
    const origHTML = btn.innerHTML;
    btn.innerHTML = '✅ 已复制';
    btn.classList.add('copied');
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = origHTML; btn.classList.remove('copied'); btn.disabled = false; }, 1500);
  }
  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function loadDemo() {
    const demo = [
      '1,2,3,4,5,6-8',
      '1,2,3,4,5,6,7,8-1',
      '胆:04,07,16,27 拖:05,08,14,15,20,30-1',
      '胆:02,08,15,22,31 拖:01,04,09,13,18,21,25,27,33-7',
      '胆:05,16,20,26,27',
      '拖:08,12,13,28,29,32-5'
    ];
    document.getElementById('comboInput').value = demo.join('\n');
    process();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('groupBtn').addEventListener('click', process);
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('comboInput').value = '';
      document.getElementById('resultsContainer').innerHTML = '<div style="color:#8899aa;text-align:center;padding:20px;">请输入组合后点击确定</div>';
    });
    document.getElementById('demoBtn').addEventListener('click', loadDemo);
  });
})();
</script>
</body>
</html>
