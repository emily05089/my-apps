<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>双应用前区筛选 · 完整版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #f5f6fa; --card-bg: #ffffff; --primary: #4a6cf7; --danger: #e74c3c; --success: #27ae60; --warning: #f39c12; --text: #2c3e50; --border: #e0e5ec; --radius: 14px; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); padding: 12px; font-size: 14px; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 16px; font-weight: 700; font-size: 15px; background: #e8f5e9; color: #27ae60; }
        textarea { width: 100%; height: 110px; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px; font-size: 14px; font-family: monospace; resize: vertical; background: #fafbfc; }
        textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
        .chip { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 18px; background: #f2f3f7; font-size: 13px; cursor: pointer; }
        .chip input { width: 16px; height: 16px; accent-color: var(--primary); }
        .btn { padding: 10px 18px; border-radius: 20px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; background: var(--primary); color: #fff; }
        .btn:active { opacity: 0.8; transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-warn { background: var(--warning); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .number-grid { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
        .n-cell { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; cursor: pointer; background: #fff; transition: 0.1s; color: #333; }
        .n-cell:active { transform: scale(0.9); }
        .n-cell.on-or { background: #ffe0e0; border-color: #e74c3c; }
        .n-cell.on-and { background: #d5e8ff; border-color: #2980b9; }
        .log { max-height: 100px; overflow-y: auto; font-size: 11px; color: #555; background: #f9fafb; border-radius: 10px; padding: 6px 10px; margin-top: 4px; }
        .progress-wrap { height: 5px; background: #eee; border-radius: 3px; margin: 4px 0; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tag { font-size: 11px; color: #999; }
        hr { margin: 10px 0; border-color: #eee; }
        .result-area { max-height: 400px; overflow-y: auto; margin-top: 8px; display: none; }
        .group-box { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; flex-wrap: wrap; gap: 4px; }
        .group-list { font-family: monospace; font-size: 12px; max-height: 120px; overflow-y: auto; background: #f9fafb; border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; line-height: 1.8; }
        .copy-btn { background: #27ae60; color: #fff; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; margin: 2px; }
        .copy-all-btn { background: #e67e22; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; white-space: nowrap; margin-left: 8px; }
        .note-box { font-size: 10px; color: #aaa; margin-top: 4px; line-height: 1.6; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-box { background: #fff; border-radius: 16px; padding: 20px; width: 90%; max-width: 500px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
        .modal-textarea { width: 100%; height: 150px; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px; font-size: 14px; font-family: monospace; resize: vertical; background: #fafbfc; }
        .modal-textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align:center;">
        <h2 style="font-size:18px;margin:0;">双应用前区筛选</h2>
        <div style="margin-top:6px;"><span>当前剩余组合：<span class="badge" id="filteredBadge">1,107,568</span></span></div>
        <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
        <div id="statusText" style="font-size:11px;color:#999;margin-top:2px;">就绪</div>
    </div>

    <div class="card">
        <b>📝 输入号码（每次筛选自动记录历史）</b>
        <textarea id="inputArea" placeholder="每行一组，支持复式/单式/胆拖
例: 1,2,3,4,5,6,7,8,9
胆:04,07,16,27 拖:05,08,14"></textarea>
        <div class="chip-row">
            <label class="chip"><input type="checkbox" id="chk0">中0个</label>
            <label class="chip"><input type="checkbox" id="chk3">中3个</label>
            <label class="chip"><input type="checkbox" id="chk4">中4个</label>
            <label class="chip"><input type="checkbox" id="chk5">中5个</label>
            <label class="chip"><input type="checkbox" id="chk6">中6个</label>
        </div>
        <div class="flex-row">
            <button class="btn" id="btnApply">⚡应用筛选</button>
            <button class="btn btn-outline btn-sm" id="btnClearInput">清空</button>
            <button class="btn btn-warn btn-sm" id="btnStats">📊 统计全部历史</button>
            <button class="btn btn-outline btn-sm" id="btnResetAll">重置</button>
        </div>
        <div class="result-area" id="resultArea">
            <div style="display:flex; align-items:center; margin-bottom:8px;">
                <b id="resultTitle" style="flex:1;">统计（含出现1次）</b>
                <button class="copy-all-btn" id="btnCopyAll">📋 一键复制全部</button>
            </div>
            <div id="resultGroups"></div>
        </div>
        <div class="log" id="logArea"><div>系统就绪</div></div>
    </div>

    <div class="card">
        <b>数字过滤（累积生效）</b>
        <div style="margin-top:8px;"><span style="color:#e74c3c;">● OR排除</span> <span class="tag">包含任一即删</span></div>
        <div class="number-grid" id="orGrid"></div>
        <button class="btn btn-outline btn-sm" id="btnApplyOR">✅ 应用OR过滤</
