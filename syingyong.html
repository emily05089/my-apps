        <div class="bottom-remain">当前剩余组合：<span class="badge" id="filteredBadgeBottom">1,107,568</span></div>
    </div>
</div>
<div class="modal-overlay" id="pairModalOverlay">

</div>

<script>
(function() {

    var filteredCount = TOTAL;
    var masksLow, masksHigh;
    var maskIndex = new Map();

        "03,07,08,09,18,32","05,06,09,21,28,30","01,05,07,18,30,32","02,06,11,12,13,33",
        "08,09,14,22,28,30","06,13,17,19,24,31","01,02,04,06,22,30","03,04,09,10,15,22",

        "02,05,17,22,30,33","10,13,14,23,24,27","02,08,11,23,27,29","08,10,14,23,28,32",
        "01,02,05,09,25,32","03,05,09,13,26,29","05,14,17,19,20,33","04,08,10,21,23,32",
        "03,13,14,18,24,31","01,05,08,14,19,23","03,04,07,13,20,30","02,10,18,19,24,27",
        "03,09,15,17,19,28","02,12,13,16,19,25","03,09,12,13,26,32","01,02,18,19,21,33",
        "07,09,23,24,25,26","16,18,19,20,25,31","06,08,10,25,29,30","01,02,04,07,13,32",
        "06,09,23,26,28,32","01,10,11,16,24,26","06,08,17,20,25,33","02,04,08,24,28,31",
        "02,03,08,19,24,30","01,20,21,25,26,27","08,10,13,15,24,31","03,09,11,13,20,32"
    ];
    var HISTORY_SET = new Set();
    for (var i = 0; i < HISTORY_LINES.length; i++) {
        var nums = HISTORY_LINES[i].split(',').map(function(s){ return parseInt(s,10); });
        if (nums.length === 6) {
            var key = nums.map(function(n){ return String(n).padStart(2,'0'); }).sort().join(',');
            HISTORY_SET.add(key);
        }
    }

    // 所有辅助函数（popcount32, buildAll, maskFrom, unmask, updateDisplay, log, setStatus, showProgress, hideProgress...）
    // 此处省略中间大量函数，与之前给出的完整代码完全一致，请直接使用上方完整 HTML。

    // 重点更新：createPrizeWorker 回调改为生成两表 Excel
    function createPrizeWorker() {
        if (prizeWorker) { prizeWorker.terminate(); }
        var workerCode = [
            "self.onmessage = function(e) {",
            "  var data = e.data;",
            "  if (data.type === 'start') {",
            "    computePrize(data.redMasks, data.historyRedBlue, data.batchSize);",
            "  }",
            "};",
            "function popcount32(v) {",
            "  v = v - ((v >>> 1) & 0x55555555);",
            "  v = (v & 0x33333333) + ((v >>> 2) & 0x33333333);",
            "  v = (v + (v >>> 4)) & 0x0F0F0F0F;",
            "  v = (v + (v >>> 8)) & 0x0F0F0F0F;",
            "  v = (v + (v >>> 16)) & 0x0F0F0F0F;",
            "  return v & 0x3F;",
            "}",
            "function prizeAmount(matchRed, matchBlue) {",
            "  if (matchRed === 6) return matchBlue ? 5000000 : 500000;",
            "  if (matchRed === 5) return matchBlue ? 3000 : 200;",
            "  if (matchRed === 4) return matchBlue ? 200 : 10;",
            "  if (matchRed === 3) return matchBlue ? 10 : 5;",
            "  if (matchRed === 2 && matchBlue) return 5;",
            "  if (matchRed === 1 && matchBlue) return 5;",
            "  if (matchRed === 0 && matchBlue) return 5;",
            "  return 0;",
            "}",
            "function computePrize(redMasks, historyRedBlue, batchSize) {",
            "  var totalRed = redMasks.length;",
            "  var prizes = new Uint32Array(totalRed * 16);",
            "  var tMasks = [];",
            "  var tBlues = [];",
            "  for (var j = 0; j < historyRedBlue.length; j++) {",
            "    var t = historyRedBlue[j];",
            "    if (t.blue !== null) {",
            "      tMasks.push({ l: t.redMaskL, h: t.redMaskH });",
            "      tBlues.push(t.blue);",
            "    }",
            "  }",
            "  var ticketCount = tMasks.length;",
            "  if (ticketCount === 0) { self.postMessage({ type: 'error', msg: '无有效历史票' }); return; }",
            "  var currentRed = 0;",
            "  function processBatch() {",
            "    var endRed = Math.min(currentRed + batchSize, totalRed);",
            "    for (var r = currentRed; r < endRed; r++) {",
            "      var rMask = redMasks[r];",
            "      var baseIdx = r * 16;",
            "      for (var t = 0; t < ticketCount; t++) {",
            "        var interLow = rMask.l & tMasks[t].l;",
            "        var interHigh = rMask.h & tMasks[t].h;",
            "        var matchRed = popcount32(interLow) + (interHigh & 1);",
            "        var ticketBlue = tBlues[t];",
            "        for (var b = 1; b <= 16; b++) {",
            "          var isBlueMatch = (b === ticketBlue) ? 1 : 0;",
            "          var prize = prizeAmount(matchRed, isBlueMatch);",
            "          if (prize) prizes[baseIdx + b - 1] += prize;",
            "        }",
            "      }",
            "    }",
            "    currentRed = endRed;",
            "    var progress = Math.round((currentRed / totalRed) * 100);",
            "    self.postMessage({ type: 'progress', progress: progress, currentRed: currentRed, totalRed: totalRed });",
            "    if (currentRed < totalRed) {",
            "      setTimeout(processBatch, 50);",
            "    } else {",
            "      var rows = [];",
            "      for (var r = 0; r < totalRed; r++) {",
            "        var reds = [];",
            "        var low = redMasks[r].l;",
            "        var high = redMasks[r].h;",
            "        for (var i = 0; i < 32; i++) { if (low & (1 << i)) reds.push(i + 1); }",
            "        if (high & 1) reds.push(33);",
            "        var redStr = reds.map(function(n){ return (n < 10 ? '0' : '') + n; }).join(',');",
            "        var baseIdx = r * 16;",
            "        for (var b = 1; b <= 16; b++) {",
            "          var amount = prizes[baseIdx + b - 1];",
            "          rows.push({ str: '\"' + redStr + '-' + (b < 10 ? '0' : '') + b + '\"', amount: amount });",
            "        }",
            "      }",
            "      rows.sort(function(a, b) { return a.amount - b.amount; });",
            "      var csvRows = [];",
            "      for (var i = 0; i < rows.length; i++) {",
            "        csvRows.push(rows[i].str + ',' + rows[i].amount);",
            "      }",
            "      self.postMessage({ type: 'complete', rows: csvRows });",
            "    }",
            "  }",
            "  processBatch();",
            "}"
        ].join('\n');
        var blob = new Blob([workerCode], { type: 'application/javascript' });
        var url = URL.createObjectURL(blob);
        prizeWorker = new Worker(url);
        URL.revokeObjectURL(url);
        prizeWorker.onmessage = function(e) {
            var data = e.data;
            if (data.type === 'progress') {
                showProgress(data.progress);
                setStatus('计算奖金中... ' + data.currentRed.toLocaleString() + ' / ' + data.totalRed.toLocaleString());
            } else if (data.type === 'complete') {
                setStatus('正在生成Excel...');
                // 解析 rows
                var allRows = data.rows;
                var fullData = [];   // 存放完整号码和金额
                var redMap = new Map(); // 红球 -> 总金额
                for (var i = 0; i < allRows.length; i++) {
                    var row = allRows[i];
                    var parts = row.split('"');
                    if (parts.length >= 3) {
                        var code = parts[1]; // e.g. "01,02,03,04,05,06-01"
                        var amount = parseInt(parts[2].substring(1), 10); // 去掉逗号
                        fullData.push([code, amount]);
                        var dashIdx = code.lastIndexOf('-');
                        var redCode = code.substring(0, dashIdx);
                        redMap.set(redCode, (redMap.get(redCode) || 0) + amount);
                    }
                }
                // 表1：完整组合（已经是排序后的）
                var sheet1Data = [['中奖号码', '中奖金额（元）']];
                for (var i = 0; i < fullData.length; i++) sheet1Data.push(fullData[i]);
                // 表2：不重复红球组合，金额汇总，排序
                var redEntries = Array.from(redMap.entries());
                redEntries.sort(function(a, b) { return a[1] - b[1]; });
                var sheet2Data = [['红球号码', '合计中奖金额（元）']];
                for (var i = 0; i < redEntries.length; i++) sheet2Data.push([redEntries[i][0], redEntries[i][1]]);
                // 创建工作簿
                var wb = XLSX.utils.book_new();
                // 表1
                var ws1 = XLSX.utils.aoa_to_sheet(sheet1Data);
                // 列宽自适应
                var maxLen1_0 = 19; // "01,02,03,04,05,06-01" 长度
                var maxLen1_1 = 10;
                for (var i = 1; i < sheet1Data.length; i++) {
                    if (sheet1Data[i][0].length > maxLen1_0) maxLen1_0 = sheet1Data[i][0].length;
                    if (String(sheet1Data[i][1]).length > maxLen1_1) maxLen1_1 = String(sheet1Data[i][1]).length;
                }
                ws1['!cols'] = [{wch: maxLen1_0 + 2}, {wch: maxLen1_1 + 2}];
                XLSX.utils.book_append_sheet(wb, ws1, '完整组合');
                // 表2
                var ws2 = XLSX.utils.aoa_to_sheet(sheet2Data);
                var maxLen2_0 = 17;
                var maxLen2_1 = 12;
                for (var i = 1; i < sheet2Data.length; i++) {
                    if (sheet2Data[i][0].length > maxLen2_0) maxLen2_0 = sheet2Data[i][0].length;
                    if (String(sheet2Data[i][1]).length > maxLen2_1) maxLen2_1 = String(sheet2Data[i][1]).length;
                }
                ws2['!cols'] = [{wch: maxLen2_0 + 2}, {wch: maxLen2_1 + 2}];
                XLSX.utils.book_append_sheet(wb, ws2, '红球汇总');
                // 下载
                var now = new Date();
                var filename = '奖金计算_' + allRows.length + '注_' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '.xlsx';
                XLSX.writeFile(wb, filename);
                log('💰 奖金计算完成，共 ' + allRows.length.toLocaleString() + ' 注，Excel已导出（含红球汇总表）');
                document.getElementById('exportHint').textContent = '✅ 奖金表已导出（两表）';
                finishOperation(Date.now());
            } else if (data.type === 'error') {
                alert(data.msg);
                finishOperation();
            }
        };
    }

    function prizeExport() {
        if (busy) return alert('处理中');
        if (filteredCount === 0) return alert('无剩余组合');
        var sourceHistory = isPrizeHistoryFixed ? fixedHistoryRedBlue : historyRedBlue;
        if (!sourceHistory.length) {
            alert('历史中没有任何带蓝球的组合。\n请先输入类似 1,2,3,4,5,6-1 的号码并点击“应用筛选”。');
            return;
        }
        if (typeof Worker === 'undefined') { alert('您的浏览器不支持Web Worker'); return; }

        busy = true;
        document.getElementById('btnPrizeExport').disabled = true;
        document.getElementById('btnPrizeExport').textContent = '计算中...';
        setStatus('准备Worker...');
        showProgress(0);

        var redMasks = [];
        for (var i = 0; i < TOTAL; i++) {
            if (filteredAlive[i]) redMasks.push({ l: masksLow[i], h: masksHigh[i] });
        }
        var historyData = [];
        for (var j = 0; j < sourceHistory.length; j++) {
            var t = sourceHistory[j];
            if (t.blue !== null) {
                var m = maskFrom(t.reds);
                historyData.push({ redMaskL: m.l, redMaskH: m.h, blue: t.blue });
            }
        }
        if (historyData.length === 0) { alert('没有有效历史票'); finishOperation(); return; }

        createPrizeWorker();
        prizeWorker.postMessage({
            type: 'start',
            redMasks: redMasks,
            historyRedBlue: historyData,
            batchSize: 50
        });
    }

    // 其余函数（exportXLSX, drawGrids, showPairModal 等）与之前版本相同，此处省略以保持简洁，
    // 但完整代码中必须包含它们，请直接使用上方提供的完整 HTML，它已包含所有函数。

    function init() {
        try {
            buildAll();
            drawGrids();
            // 绑定事件...（此处代码与之前相同，请使用完整版）
            log('✅ 双表Excel导出已就绪，列宽自动适应');
        } catch(e) { alert('初始化失败：' + e.message); console.error(e); }
    }
    init();
})();
</script>
