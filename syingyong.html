<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>双应用前区筛选 · 终极完整版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #f5f6fa; --card-bg: #ffffff; --primary: #4a6cf7; --danger: #e74c3c; --success: #27ae60; --warning: #f39c12; --text: #2c3e50; --border: #e0e5ec; --radius: 14px; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); padding: 12px; font-size: 14px; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 16px; font-weight: 700; font-size: 15px; background: #e8f5e9; color: #27ae60; }
        textarea { width: 100%; height: 110px; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px; font-size: 14px; font-family: monospace; resize: vertical; background: #fafbfc; }
        textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
        .chip { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 18px; background: #f2f3f7; font-size: 13px; cursor: pointer; }
        .chip input { width: 16px; height: 16px; accent-color: var(--primary); }
        .btn { padding: 10px 18px; border-radius: 20px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; background: var(--primary); color: #fff; }
        .btn:active { opacity: 0.8; transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-warn { background: var(--warning); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-keep { background: #16a085; color: #fff; }
        .btn-fixed { background: #2c3e50; color: #fff; }
        .btn-prize-fix { background: #e91e63; color: #fff; }
        .btn-prize-fix.active { background: #4caf50; color: #fff; }
        .btn-rank { background: #e67e22; color: #fff; }
        .btn-stats { background: #16a085; color: #fff; }
        .btn-pair-rank { background: #8e44ad; color: #fff; }
        .btn-pair-exclude { background: #e74c3c; color: #fff; }
        .btn-odd-even { background: #d35400; color: #fff; }
        .btn-hist-hit { background: #c0392b; color: #fff; }
        .btn-xor { background: #9b59b6; color: #fff; }
        .btn-or2 { background: #e67e22; color: #fff; }
        .btn-sum { background: #2980b9; color: #fff; }
        .btn-match { background: #e74c3c; color: #fff; }
        .btn-check { background: #c0392b; color: #fff; }
        .btn-verify { background: #2ecc71; color: #fff; }
        .btn-smart { background: #8e44ad; color: #fff; }
        .btn-diff { background: #8e44ad; color: #fff; }
        .btn-top3 { background: #e67e22; color: #fff; }
        .btn-copy-digit { background: #2980b9; color: #fff; }
        .btn-exclude-stats { background: #c0392b; color: #fff; }
        .btn-keep-match { background: #2ecc71; color: #fff; }
        .number-grid { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
        .zone-row { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
        .n-cell { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; cursor: pointer; background: #fff; transition: 0.1s; color: #333; }
        .n-cell:active { transform: scale(0.9); }
        .n-cell.on-or { background: #ffe0e0; border-color: #e74c3c; }
        .n-cell.on-and { background: #d5e8ff; border-color: #2980b9; }
        .n-cell.on-keep { background: #d4edda; border-color: #27ae60; }
        .n-cell.on-match { background: #fff3cd; border-color: #f39c12; }
        .n-cell.on-check { background: #ffd700; border-color: #ff8c00; }
        .n-cell.on-km { background: #cce5ff; border-color: #0066cc; }
        .log { max-height: 100px; overflow-y: auto; font-size: 11px; color: #555; background: #f9fafb; border-radius: 10px; padding: 6px 10px; margin-top: 4px; }
        .progress-wrap { height: 5px; background: #eee; border-radius: 3px; margin: 4px 0; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tag { font-size: 11px; color: #999; }
        hr { margin: 10px 0; border-color: #eee; }
        .result-area { max-height: 400px; overflow-y: auto; margin-top: 8px; display: none; }
        .group-box { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; flex-wrap: wrap; gap: 4px; }
        .group-list { font-family: monospace; font-size: 12px; max-height: 120px; overflow-y: auto; background: #f9fafb; border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; line-height: 1.8; }
        .copy-btn { background: #27ae60; color: #fff; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; margin: 2px; }
        .copy-all-btn { background: #e67e22; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; white-space: nowrap; margin-left: 4px; }
        .copy-unique-btn { background: #2980b9; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; white-space: nowrap; margin-left: 4px; }
        .note-box { font-size: 10px; color: #aaa; margin-top: 4px; line-height: 1.6; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-box { background: #fff; border-radius: 16px; padding: 20px; width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
        .modal-textarea { width: 100%; height: 150px; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px; font-size: 14px; font-family: monospace; resize: vertical; background: #fafbfc; }
        .modal-input { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; margin-bottom: 10px; background: #fafbfc; }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
        .bottom-remain { text-align: center; font-size: 13px; margin-top: 6px; color: var(--text); }
        .sort-btns { display: flex; gap: 6px; margin-left: 8px; }
        .sort-btn { padding: 2px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid #ccc; background: #fff; color: #333; }
        .sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .zone-exclude-row { margin-bottom: 8px; }
        .zone-exclude-row .zone-name { font-weight: 600; font-size: 13px; margin-right: 8px; min-width: 70px; display: inline-block; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; }
        .checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 14px; cursor: pointer; }
        .match-result-area { max-height: 600px; overflow-y: auto; margin-top: 10px; }
        .match-group { background: #f8f9fa; border: 1px solid #e0e5ec; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .match-group-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #e74c3c; }
        .match-group-list { font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto; background: #fff; border-radius: 6px; padding: 6px 10px; line-height: 1.8; margin-bottom: 8px; }
        .prize-table { width: 100%; font-size: 12px; margin-top: 8px; border-collapse: collapse; }
        .prize-table th, .prize-table td { border: 1px solid #ddd; padding: 4px 8px; text-align: center; }
        .cancel-float-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; background: #e74c3c; color: #fff; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none; }
        .cancel-float-btn:disabled { background: #999; cursor: not-allowed; }
        .content-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 15px; }
        .content-table th, .content-table td { border: 1px solid #ddd; padding: 4px 6px; text-align: center; }
        .content-table .cb-cell { width: 30px; }
        .content-table th { background: #f5f5f5; }
        .content-modal-body { max-height: 60vh; overflow-y: auto; margin: 10px 0; }
        .keep-match-tag { display: inline-block; background: #cce5ff; color: #0066cc; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px; }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align:center;">
        <h2 style="font-size:18px;margin:0;">双应用前区筛选</h2>
        <div style="margin-top:6px;"><span>当前剩余组合：<span class="badge" id="filteredBadge">1,107,568</span></span></div>
        <div style="margin-top:6px;">

    <div class="card">

            <label class="chip"><input type="checkbox" id="chk2">中2个</label>
            <label class="chip"><input type="checkbox" id="chk3">中3个</label>
            <label class="chip"><input type="checkbox" id="chk4">中4个</label>
            <label class="chip"><input type="checkbox" id="chk5">中5个</label>
            <label class="chip"><input type="checkbox" id="chk6">中6个</label>

        <div class="flex-row">

            <button class="btn btn-outline btn-sm" id="btnClearInput">清空</button>
            <button class="btn btn-warn btn-sm" id="btnStats">📊 统计历史</button>
            <button class="btn btn-outline btn-sm" id="btnResetAll">重置</button>
            <button class="btn btn-match btn-sm" id="btnMatchAnalyze">🔍 匹配分析</button>
            <button class="btn btn-outline btn-sm" id="btnRemainingStats">📈 剩余统计</button>
        </div>
    </div>

    <div class="card">
        <b>数字过滤</b>
        <div style="margin-top:8px;"><span style="color:#e74c3c;">● OR排除</span></div>
        <div class="number-grid" id="orGrid"><div class="zone-row" id="orZone1"></div><div class="zone-row" id="orZone2"></div><div class="zone-row" id="orZone3"></div></div>
        <button class="btn btn-outline btn-sm" id="btnApplyOR">应用OR</button>
        <button class="btn btn-outline btn-sm" id="btnClearOR">清除</button>
        <div style="margin-top:12px;"><span style="color:#2980b9;">● AND排除</span></div>
        <div class="number-grid" id="andGrid"><div class="zone-row" id="andZone1"></div><div class="zone-row" id="andZone2"></div><div class="zone-row" id="andZone3"></div></div>
        <button class="btn btn-outline btn-sm" id="btnApplyAND">应用AND</button>
        <button class="btn btn-outline btn-sm" id="btnClearAND">清除</button>
    </div>

    <div class="card">
        <b>特殊条件</b>
        <div class="flex-row" style="margin-top:6px;">
            <button class="btn btn-danger btn-sm" id="btnAllOdd">全奇</button>
            <button class="btn btn-danger btn-sm" id="btnAllEven">全偶</button>
            <button class="btn btn-odd-even btn-sm odd-even-btn" data-odd="1" data-even="5">1奇5偶</button>
            <button class="btn btn-odd-even btn-sm odd-even-btn" data-odd="2" data-even="4">2奇4偶</button>
            <button class="btn btn-odd-even btn-sm odd-even-btn" data-odd="3" data-even="3">3奇3偶</button>
            <button class="btn btn-odd-even btn-sm odd-even-btn" data-odd="4" data-even="2">4奇2偶</button>
            <button class="btn btn-odd-even btn-sm odd-even-btn" data-odd="5" data-even="1">5奇1偶</button>
        </div>
        <div class="flex-row" style="margin-top:6px;">
            <button class="btn btn-danger btn-sm" id="btn2Seq">2连</button>
            <button class="btn btn-danger btn-sm" id="btn3Seq">3连</button>
            <button class="btn btn-danger btn-sm" id="btn2Gap">2隔</button>
            <button class="btn btn-danger btn-sm" id="btn3Gap">3隔</button>
            <button class="btn btn-danger btn-sm" id="btnTail3">同尾≥3</button>
            <button class="btn btn-danger btn-sm" id="btnRatio321">3:2:1</button>
            <button class="btn btn-danger btn-sm" id="btnRatio222">2:2:2</button>
            <button class="btn btn-danger btn-sm" id="btnExcludeHistory">排除历史</button>
            <button class="btn btn-hist-hit btn-sm" id="btnExcludeHist5">排除中5</button>
            <button class="btn btn-keep btn-sm" id="btnKeepHist5">⭐保留中5</button>
        </div>
        <div class="flex-row" style="margin-top:6px;">
            <button class="btn btn-keep btn-sm" id="btnKeep2Seq">⭐保留2连</button>
            <button class="btn btn-keep btn-sm" id="btnKeep2Gap">⭐保留2隔</button>
            <button class="btn btn-keep btn-sm" id="btnKeepOnly">⭐只保留</button>
            <button class="btn btn-keep btn-sm" id="btnKeepDigits">⭐保留数字</button>
            <button class="btn btn-sum btn-sm" id="btnExcludeSumRange">🎯和值</button>
            <button class="btn btn-keep-match btn-sm" id="btnKeepMatch">⭐匹配个数</button>
        </div>
    </div>

    <div class="card">
        <b>导出与统计</b>
        <div class="flex-row" style="margin-top:6px;">
            <button class="btn" id="btnExport">📥 导出Excel</button>
            <button class="btn btn-stats btn-sm" id="btnShowDigitStats">📊 数字统计</button>
            <button class="btn btn-stats btn-sm" id="btnShowTop3Stats">📊 前三统计</button>
            <button class="btn btn-stats btn-sm" id="btnShowTop4Stats">📊 前四统计</button>
            <button class="btn btn-stats btn-sm" id="btnShowTop5Stats">📊 前五统计</button>
            <button class="btn btn-pair-rank btn-sm" id="btnShowPairRank">📊 双数字</button>
            <button class="btn btn-pair-exclude btn-sm" id="btnPairRankExclude">🔢 排名排除</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="contentModalOverlay" data-content-type="">

</div>

<script>

function buildPairRankings() {
    var src = historyRedBlue.length > 0 ? historyRedBlue : HISTORY_ARRAYS.map(function(arr) { return { reds: arr.slice(), blue: null }; });
    var pairCount = {};
    var digitCount = {};
    for (var i = 0; i < src.length; i++) {
        var nums = src[i].reds.slice().sort(function(a,b){return a-b;});
        if (nums.length < 6) continue;
        for (var d = 0; d < nums.length; d++) digitCount[nums[d]] = (digitCount[nums[d]] || 0) + 1;
        for (var p = 0; p < nums.length; p++) for (var q = p + 1; q < nums.length; q++) {
            var a = nums[p], b = nums[q];
            var key = a < b ? String(a).padStart(2,'0')+','+String(b).padStart(2,'0') : String(b).padStart(2,'0')+','+String(a).padStart(2,'0');
            pairCount[key] = (pairCount[key] || 0) + 1;
        }
    }
    var pairs = [];
    for (var a = 1; a <= 32; a++) for (var b = a + 1; b <= 33; b++) {
        var key = String(a).padStart(2,'0')+','+String(b).padStart(2,'0');
        pairs.push({ key: key, count: pairCount[key] || 0 });
    }
    pairs.sort(function(x,y){ return y.count !== x.count ? y.count - x.count : (x.key < y.key ? -1 : 1); });
    pairRankMap = {};
    for (var i = 0; i < pairs.length; i++) pairRankMap[pairs[i].key] = i + 1;
    var digits = [];
    for (var d = 1; d <= 33; d++) digits.push({ num: d, count: digitCount[d] || 0 });
    digits.sort(function(x,y){ return y.count !== x.count ? y.count - x.count : x.num - y.num; });
    digitRankMap = {};
    for (var i = 0; i < digits.length; i++) digitRankMap[digits[i].num] = i + 1;
}

function getPairRanks(arr) {
    if (!pairRankMap) return [];
    var ranks = [];
    for (var p = 0; p < arr.length; p++) for (var q = p + 1; q < arr.length; q++) {
        var a = arr[p], b = arr[q];
        var key = a < b ? String(a).padStart(2,'0')+','+String(b).padStart(2,'0') : String(b).padStart(2,'0')+','+String(a).padStart(2,'0');
        var rank = pairRankMap[key];
        ranks.push(rank || 0);
    }
    ranks.sort(function(a,b){return a-b;});
    return ranks;
}

function getDigitRanks(arr) {
    if (!digitRankMap) return [];
    var ranks = [];
    for (var i = 0; i < arr.length; i++) ranks.push(digitRankMap[arr[i]] || 0);
    ranks.sort(function(a,b){return a-b;});
    return ranks;
}

function excludeSelectedFromContent() {
    var modal = document.getElementById('contentModalOverlay');

    var combosToDelete = new Set();
    
    if (contentType === 'pairrank') {
        document.querySelectorAll('.pair-rank-cb:checked').forEach(function(cb) { combosToDelete.add(cb.dataset.combo); });
    } else if (contentType === 'digitstats') {
        var digitSet = new Set();
        document.querySelectorAll('.digit-stats-cb:checked').forEach(function(cb) { digitSet.add(parseInt(cb.dataset.digit)); });
        if (!digitSet.size) return alert('请勾选数字');
        for (var i = 0; i < TOTAL; i++) {
            if (!filteredAlive[i]) continue;
            var nums = unmask(masksLow[i], masksHigh[i]);
            for (var j = 0; j < nums.length; j++) {
                if (digitSet.has(nums[j])) {
                    combosToDelete.add(nums.map(function(n){return String(n).padStart(2,'0');}).join(','));
                    break;
                }
            }
        }
    } else if (contentType === 'topnstats') {
        var prefixSet = new Set();
        document.querySelectorAll('.topn-stats-cb:checked').forEach(function(cb) { prefixSet.add(cb.dataset.prefix); });
        if (!prefixSet.size) return alert('请勾选');
        var n = topNStatsType === 'top3' ? 3 : (topNStatsType === 'top4' ? 4 : 5);
        for (var i = 0; i < TOTAL; i++) {
            if (!filteredAlive[i]) continue;
            var nums = unmask(masksLow[i], masksHigh[i]);
            var prefix = nums.slice(0, n).map(function(x){return String(x).padStart(2,'0');}).join(',');
            if (prefixSet.has(prefix)) {
                combosToDelete.add(nums.map(function(x){return String(x).padStart(2,'0');}).join(','));
            }
        }
    } else {
        return alert('当前内容不支持删除');
    }
    
    if (!combosToDelete.size) return alert('请勾选');
    if (!confirm('将删除 ' + combosToDelete.size.toLocaleString() + ' 个组合？')) return;
    document.getElementById('contentModalOverlay').style.display = 'none';
    saveUndoState();
    var removed = 0;
    for (var i = 0; i < TOTAL; i++) {
        if (!filteredAlive[i]) continue;
        var nums = unmask(masksLow[i], masksHigh[i]);
        if (combosToDelete.has(nums.map(function(n){return String(n).padStart(2,'0');}).join(','))) {
            filteredAlive[i] = 0;
            removed++;
        }
    }
    filteredCount -= removed;
    updateDisplay();
    log('✅ 删除勾选：移除 ' + removed.toLocaleString() + ' 组');
}

        if (globalAbortFlag) { finishOperation(startTime); return; }

        for (var i = start; i < end; i++) {
            if (!filteredAlive[i]) continue;
            var arr = unmask(masksLow[i], masksHigh[i]);

            if (hasGap(arr,3)) stats['3隔号']++;

            var oe = countOddEven(arr);
            if (oe.odd === 6) stats['全奇']++;
            if (oe.even === 6) stats['全偶']++;
            if (hasSeq(arr,2)) stats['2连号']++;
            if (hasGap(arr,2)) stats['2隔号']++;
        }
        done = end;
        showProgress(Math.round(done / TOTAL * 100));
        if (done < TOTAL) setTimeout(function() { step(done); }, 10);
        else {
            var html = '<table class="content-table"><thead><tr><th>选</th><th>条件</th><th>数量</th></tr></thead><tbody>';
            var keys = Object.keys(stats);
            for (var k = 0; k < keys.length; k++) {

function statsMatch(key, arr) {
    if (key === '3连号') return hasSeq(arr,3);
    if (key === '3隔号') return hasGap(arr,3);
    if (key === '同尾≥3') return hasSameTail3(arr);
    if (key === '2:2:2') return getSortedZonePattern(arr) === '2:2:2';
    if (key === '3:2:1') return getSortedZonePattern(arr) === '1:2:3';
    var oe = countOddEven(arr);
    if (key === '全奇') return oe.odd === 6;
    if (key === '全偶') return oe.even === 6;
    if (key === '2连号') return hasSeq(arr,2);
    if (key === '2隔号') return hasGap(arr,2);
    return false;
}

function confirmMatchAnalysis() {
    var sel = Array.from(matchSel);
    var input = document.getElementById('matchInputArea').value.trim();
    var inputNums = [];
    if (input) input.split(/[\n\r,，]+/).forEach(function(p) { var n = parseInt(p,10); if(n>=1&&n<=33) inputNums.push(n); });
    var allNums = sel.concat(inputNums);
    if (!allNums.length) return alert('请选择数字');
    if (!filteredCount) return alert('无剩余');
    if (busy) return alert('处理中');
    var startTime = Date.now();
    busy = true;
    setStatus('匹配分析中...');
    showProgress(0);
    showGlobalCancel();
    globalAbortFlag = false;
    var matchSet = new Set(allNums);
    var m6=[],m5=[],m4=[],m3=[],m2=[],m1=[];
    var done = 0, BATCH = 100000;
    function step(start) {
        if (globalAbortFlag) { finishOperation(startTime); return; }
        var end = Math.min(start + BATCH, TOTAL);
        for (var i = start; i < end; i++) {
            if (!filteredAlive[i]) continue;
            var nums = unmask(masksLow[i], masksHigh[i]);
            var c = 0;
            for (var j = 0; j < nums.length; j++) if (matchSet.has(nums[j])) c++;
            var str = nums.map(function(n){return String(n).padStart(2,'0');}).join(',');
            if (c===6)m6.push(str); else if(c===5)m5.push(str); else if(c===4)m4.push(str); else if(c===3)m3.push(str); else if(c===2)m2.push(str); else if(c===1)m1.push(str);
        }
        done = end;
        showProgress(Math.round(done / TOTAL * 100));
        if (done < TOTAL) setTimeout(function(){ step(done); }, 10);
        else {
            var html = '';
            function addBlock(label, arr) {
                if (arr.length) html += '<div class="match-group"><div class="match-group-title"><label><input type="checkbox" class="match-group-cb" data-group="' + label + '"> ' + label + '（' + arr.length + '组）</label></div><div class="match-group-list">' + arr.slice(0,200).join('<br>') + '</div></div>';
            }
            addBlock('m6', m6); addBlock('m5', m5); addBlock('m4', m4); addBlock('m3', m3); addBlock('m2', m2); addBlock('m1', m1);
            document.getElementById('matchResultContent').innerHTML = html;
            document.getElementById('matchResultArea').style.display = 'block';
            matchResultCache = {m6:m6,m5:m5,m4:m4,m3:m3,m2:m2,m1:m1};
            document.getElementById('btnMatchKeepSelected').onclick = function() {
                if (!matchResultCache) return alert('无数据');
                var cbs = document.querySelectorAll('.match-group-cb:checked');
                if (!cbs.length) return alert('请勾选');
                var keepSet = new Set();
                cbs.forEach(function(cb) { var arr = matchResultCache[cb.dataset.group]; if(arr) arr.forEach(function(s){keepSet.add(s);}); });
                if (!keepSet.size) return alert('无组合');
                if (!confirm('保留 ' + keepSet.size.toLocaleString() + ' 组？')) return;
                document.getElementById('matchModalOverlay').style.display = 'none';
                saveUndoState();
                var removed = 0;
                for (var i = 0; i < TOTAL; i++) {
                    if (!filteredAlive[i]) continue;
                    var nums = unmask(masksLow[i], masksHigh[i]);
                    var str = nums.map(function(n){return String(n).padStart(2,'0');}).join(',');
                    if (!keepSet.has(str)) { filteredAlive[i]=0; removed++; }
                }
                filteredCount -= removed;
                updateDisplay();
                log('✅ 匹配保留：剩余 ' + filteredCount.toLocaleString() + ' 组');
            };
            finishOperation(startTime);
        }
    }
    step(0);
}

// ========== 排除历史中5个 ==========
function applyExcludeHistByCount(targetCount) {
    if (!filteredCount) return alert('无剩余');
    if (!confirm('删除与历史组合恰好有' + targetCount + '个相同数字的组合？')) return;
    saveUndoState();
    var startTime = Date.now();
    busy = true;
    setStatus('排除中...');
    showProgress(0);
    showGlobalCancel();
    globalAbortFlag = false;
    var removeSet = new Set();
    var total = HIST_MASKS.length;
    var done = 0;
    function process(start) {
        if (globalAbortFlag) { finishOperation(startTime); return; }
        var end = Math.min(start + 5, total);
        for (var h = start; h < end; h++) {
            var nums = unmask(HIST_MASKS[h].l, HIST_MASKS[h].h);
            var others = [];
            for (var i = 1; i <= 33; i++) if (nums.indexOf(i) === -1) others.push(i);
            if (targetCount === 5) {
                for (var i = 0; i < 6; i++) {
                    var base = nums.filter(function(_,idx){return idx!==i;});
                    for (var j = 0; j < others.length; j++) {
                        var m = maskFrom(base.concat([others[j]]).sort(function(a,b){return a-b;}));
                        var idx = maskIndex.get(m.l+'_'+m.h);
                        if (idx !== undefined) removeSet.add(idx);
                    }
                }
            }
        }
        done = end;
        showProgress(Math.round(done / total * 100));
        if (done < total) setTimeout(function(){ process(done); }, 10);
        else {
            var removed = 0;
            removeSet.forEach(function(idx) { if (filteredAlive[idx]) { filteredAlive[idx]=0; removed++; } });
            filteredCount -= removed;
            updateDisplay();
            log('✅ 排除中' + targetCount + '个：移除 ' + removed.toLocaleString() + ' 组');
            finishOperation(startTime);
        }
    }
    process(0);
}

// ========== 初始化 ==========
function init() {
    try {
        buildAll();
        buildHistMasks();
        buildPairRankings();
        drawGrids();

        drawMatchGrid();
        drawKeepMatchGrid();

        document.getElementById('btnApply').addEventListener('click', function() {
            if (busy) return alert('处理中');
            addToHistory();
            var expanded = expandCurrent();
            if (!expanded.length) return alert('无有效组合');
            var masks = expanded.map(function(x) { return maskFrom(x.reds); });
            var unique = [];
            var seen = new Set();
            for (var i = 0; i < masks.length; i++) {
                var k = masks[i].l + '_' + masks[i].h;
                if (!seen.has(k)) { seen.add(k); unique.push(masks[i]); }
            }
            saveUndoState();
            var opts = {
                zero: document.getElementById('chk0').checked,
                two: document.getElementById('chk2').checked,
                three: document.getElementById('chk3').checked,
                four: document.getElementById('chk4').checked,
                five: document.getElementById('chk5').checked,
                six: document.getElementById('chk6').checked
            };
            if (!opts.zero && !opts.two && !opts.three && !opts.four && !opts.five && !opts.six) return alert('请勾选条件');
            var startTime = Date.now();
            busy = true;
            setStatus('筛选中...');
            showProgress(0);
            showGlobalCancel();
            globalAbortFlag = false;
            var removeSet = new Set();
            var total = unique.length;
            var done = 0;
            function process(start) {
                if (globalAbortFlag) { finishOperation(startTime); return; }
                var end = Math.min(start + 50, total);
                for (var i = start; i < end; i++) {
                    var cm = unique[i];
                    var nums = unmask(cm.l, cm.h);
                    var others = [];
                    for (var d = 1; d <= 33; d++) if (nums.indexOf(d) === -1) others.push(d);
                    [2,3,4,5,6].forEach(function(k) {
                        if (!opts['two'] && k===2) return;
                        if (!opts['three'] && k===3) return;
                        if (!opts['four'] && k===4) return;
                        if (!opts['five'] && k===5) return;
                        if (!opts['six'] && k===6) return;
                        if (k === 6) { var idx = maskIndex.get(cm.l+'_'+cm.h); if (idx!==undefined) removeSet.add(idx); return; }
                        var comb = combos(nums, k);
                        for (var ci = 0; ci < comb.length; ci++) {
                            var base = comb[ci];
                            var need = 6 - k;
                            var oc = combos(others, need);
                            for (var oi = 0; oi < oc.length; oi++) {
                                var m = maskFrom(base.concat(oc[oi]).sort(function(a,b){return a-b;}));
                                var idx = maskIndex.get(m.l+'_'+m.h);
                                if (idx !== undefined) removeSet.add(idx);
                            }
                        }
                    });
                }
                done = end;
                showProgress(Math.round(done / total * 100));
                if (done < total) setTimeout(function(){ process(done); }, 5);
                else {
                    var removed = 0;
                    removeSet.forEach(function(idx) { if (filteredAlive[idx]) { filteredAlive[idx]=0; removed++; } });
                    filteredCount -= removed;
                    updateDisplay();
                    log('✅ 筛选：移除 ' + removed.toLocaleString() + ' 组');
                    document.getElementById('inputArea').value = '';
                    lastInputSnapshot = '';
                    finishOperation(startTime);
                }
            }
            process(0);
        });
        document.getElementById('btnClearInput').addEventListener('click', function() { document.getElementById('inputArea').value = ''; });
        document.getElementById('btnStats').addEventListener('click', function() {
            addToHistory();
            if (!historyCombos.length) return alert('历史为空');
            var map = new Map();
            for (var i = 0; i < historyCombos.length; i++) {
                var k = historyCombos[i].map(function(n){return String(n).padStart(2,'0');}).join(',');
                map.set(k, (map.get(k)||0)+1);

            var rows = [];
