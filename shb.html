<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组合合并工具（紧凑版 + 注数统计 + 中奖分组）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; margin: 0; padding: 20px; color: #222;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .label { font-size: 14px; font-weight: 600; margin: 14px 0 6px; color: #333; }
  textarea {
    width: 100%; height: 190px; padding: 10px 12px;
    font-family: Consolas, Monaco, monospace; font-size: 14px;
    border: 1px solid #ccc; border-radius: 8px; resize: vertical;
    line-height: 1.6; background: #fff; outline: none;
  }
  textarea:focus { border-color: #2d7ef7; box-shadow: 0 0 0 3px rgba(45,126,247,.15); }
  .bar { margin: 12px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 9px 20px; border-radius: 8px; border: none;
    background: #2d7ef7; color: #fff; font-size: 14px; cursor: pointer;
    transition: .15s;
  }
  button:hover { background: #1a68db; }
  button.gray { background: #6b7280; }
  button.gray:hover { background: #4b5563; }
  button.orange { background: #f59e0b; }
  button.orange:hover { background: #d97706; }
  button.mini {
    padding: 4px 10px; font-size: 12px; background: #10b981; flex: 0 0 auto;
    min-width: 58px;
  }
  button.mini:hover { background: #059669; }
  #output {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 10px 12px; min-height: 90px;
  }
  .row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0; border-bottom: 1px dashed #eee;
  }
  .row:last-child { border-bottom: none; }
  .row code {
    font-family: Consolas, Monaco, monospace; font-size: 14px;
    white-space: pre-wrap; word-break: break-all; line-height: 1.7;
    padding-top: 3px;
  }
  .empty { color: #aaa; font-size: 14px; padding: 8px 0; }
  .hint { font-size: 12px; color: #777; margin-top: 8px; line-height: 1.7; }
  .count {
    font-size: 13px; color: #2d7ef7; margin: 10px 0 6px; font-weight: 600;
    line-height: 1.8;
  }
  .count b { color: #e11d48; }
  .group { margin: 12px 0; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
  .group-title {
    background: #f0f5ff; padding: 8px 12px; font-weight: 600;
    font-size: 14px; color: #1d4ed8; border-bottom: 1px solid #e5e7eb;
  }
  .group .row { padding: 6px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>组合合并工具（紧凑版 + 注数统计 + 中奖分组）</h1>

  <div class="label">① 输入原数据（每行一条）</div>
  <textarea id="input" placeholder="01,10,15,20,22,27,30,31-01
01,10,15,20,22,27,30,31-02
胆:03,24,29，拖:02,08,10,13,14,15,18,19,21,25,27,30,33-13"></textarea>

  <div class="bar">
    <button id="run">确定</button>
    <button id="winBtn" class="orange">输入中奖号码</button>
    <button id="copyAll" class="gray">复制全部结果</button>
    <button id="clearAll" class="gray">清空</button>
  </div>

  <div class="label">② 合并结果</div>
  <div id="output"><div class="empty">（还没有结果，请先输入数据并点“确定”）</div></div>

  <div class="hint">
    规则：只有<b>连续相邻</b>且 “-” 前面完全相同的行才会合并；后区去重并升序排列；
    若后区覆盖 01~16 全部号码，则显示为 <b>-全部</b>；
    相同组合重复出现时，用 <b>✖️次数</b> 表示（只出现一次不加乘号）。
    注数按前区 6 个号、后区 1 个号的组合规则计算：C(前区个数,6) × 后区个数（后区“全部”按 16 个计算），带 ✖️N 再乘以 N。
    点击“输入中奖号码”后，可按命中情况分组展示。
  </div>
</div>

<script>
(function () {
  const inputEl  = document.getElementById('input');
  const outputEl = document.getElementById('output');

  let currentRows = [];   // 当前输出行对象数组
  let totalBets   = 0;    // 总注数
  let winInfo     = null; // { fronts: [..], back: n, raw: '...' }

  // 分组顺序
  const ORDER = ['6+1','6+0','5+1','5+0','4+1','4+0','3+1','2+1','1+1','0+1','3+0','2+0','1+0','0+0'];

  /* ---------- 组合数 ---------- */
  function comb(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    k = Math.min(k, n - k);
    let r = 1;
    for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
    return Math.round(r);
  }

  /* ---------- 工具函数 ---------- */
  function keyOf(s) {
    const n = parseInt(s, 10);
    return isNaN(n) ? s : n;
  }
  function numOf(s) {
    const n = parseInt(s, 10);
    return isNaN(n) ? 999999 : n;
  }

  function splitLine(line) {
    const s = line.trim();
    if (!s) return null;
    const i = s.lastIndexOf('-');
    if (i <= 0) {
      return { front: s.replace(/\s+/g, ''), backs: [] };
    }
    const front = s.slice(0, i).trim();
    const backStr = s.slice(i + 1).trim();
    const backs = backStr.split(/[,，、\s]+/).filter(Boolean);
    return { front, backs };
  }

  // 解析前区（支持单式、复式、胆拖）
  function parseFront(front) {
    if (/[胆拖]/.test(front)) {
      let danStr = '', tuoStr = '';
      const dm = front.match(/胆\s*[:：]?\s*([\d,，、\s]+)/);
      const tm = front.match(/拖\s*[:：]?\s*([\d,，、\s]+)/);
      if (dm) danStr = dm[1];
      if (tm) tuoStr = tm[1];
      const danNums = danStr.split(/[,，、\s]+/).filter(Boolean);
      const tuoNums = tuoStr.split(/[,，、\s]+/).filter(Boolean);
      return {
        isDanTuo: true,
        danNums, tuoNums,
        danCount: danNums.length,
        tuoCount: tuoNums.length,
        nums: danNums.concat(tuoNums),
        frontCount: danNums.length + tuoNums.length
      };
    }
    const nums = front.split(/[,，、\s]+/).filter(Boolean);
    return { isDanTuo: false, nums, danNums: [], tuoNums: [], danCount: 0, tuoCount: 0, frontCount: nums.length };
  }

  // 计算注数（前区 6 个，后区 1 个）
  function calcBets(frontInfo, backCount, multiplier) {
    let frontComb;
    if (frontInfo.isDanTuo) {
      const need = 6 - frontInfo.danCount;
      if (need < 0 || need > frontInfo.tuoCount) return 0;
      frontComb = comb(frontInfo.tuoCount, need);
    } else {
      if (frontInfo.frontCount < 6) return 0;
      frontComb = comb(frontInfo.frontCount, 6);
    }
    return frontComb * backCount * (multiplier || 1);
  }

  // 判定某行最佳命中
  function classifyRow(row, winFrontSet, winBack) {
    const fi = row.frontInfo;
    let hit;
    if (fi.isDanTuo) {
      const danHit = fi.danNums.filter(n => winFrontSet.has(parseInt(n, 10))).length;
      const tuoHit = fi.tuoNums.filter(n => winFrontSet.has(parseInt(n, 10))).length;
      hit = danHit + Math.min(tuoHit, 6 - fi.danCount);
    } else {
      const raw = fi.nums.filter(n => winFrontSet.has(parseInt(n, 10))).length;
      hit = Math.min(raw, 6);
    }
    let backHit = 0;
    if (row.backAll) backHit = 1;
    else if (row.backs.some(n => parseInt(n, 10) === winBack)) backHit = 1;
    return { front: hit, back: backHit };
  }

  /* ---------- 核心合并 ---------- */
  function run() {
    const lines = inputEl.value.split(/\r?\n/);
    const items = [];
    for (const line of lines) {
      const p = splitLine(line);
      if (p) items.push(p);
    }

    if (!items.length) {
      currentRows = [];
      totalBets = 0;
      render();
      return;
    }

    // 1. 按“连续且前区相同”切成若干段
    const blocks = [];
    for (const it of items) {
      const last = blocks[blocks.length - 1];
      if (last && last.front === it.front) {
        last.items.push(it);
      } else {
        blocks.push({ front: it.front, items: [it] });
      }
    }

    // 2. 每段内部合并后区，并计算注数
    currentRows = [];
    totalBets = 0;

    for (const b of blocks) {
      const map = new Map();
      let hasBack = false;

      for (const it of b.items) {
        if (it.backs.length > 0) hasBack = true;
        for (const bk of it.backs) {
          const k = keyOf(bk);
          if (!map.has(k)) map.set(k, { text: bk, count: 0 });
          map.get(k).count++;
        }
      }

      let base, maxCount, backCount, backs = [], backAll = false;

      if (!hasBack) {
        base = b.front;
        maxCount = b.items.length;
        backCount = 0;
      } else {
        const arr = Array.from(map.values())
          .sort((a, c) => numOf(a.text) - numOf(c.text) || a.text.localeCompare(c.text));

        let isAll = false;
        if (map.size === 16) {
          isAll = true;
          for (let i = 1; i <= 16; i++) {
            if (!map.has(i)) { isAll = false; break; }
          }
        }

        if (isAll) {
          base = b.front + '-全部';
          backCount = 16;
          backAll = true;
        } else {
          base = b.front + '-' + arr.map(v => v.text).join(',');
          backCount = arr.length;
          backs = arr.map(v => v.text);
        }

        maxCount = Math.max.apply(null, arr.map(v => v.count));
      }

      const frontInfo = parseFront(b.front);
      const betsPerLine = calcBets(frontInfo, backCount, maxCount);
      totalBets += betsPerLine;

      let display = base;
      if (maxCount > 1) display += ' ✖️' + maxCount;

      currentRows.push({
        front: b.front,
        frontInfo,
        backs,
        backAll,
        maxCount,
        bets: betsPerLine,
        display
      });
    }

    render();
  }

  /* ---------- 渲染 ---------- */
  function render() {
    outputEl.innerHTML = '';

    if (!currentRows.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '（还没有结果，请先输入数据并点“确定”）';
      outputEl.appendChild(d);
      return;
    }

    if (winInfo) renderGrouped();
    else renderFlat();
  }

  function renderFlat() {
    const c = document.createElement('div');
    c.className = 'count';
    c.innerHTML = '共 ' + currentRows.length + ' 行 ｜ 总注数：<b>' + totalBets + '</b> 注';
    outputEl.appendChild(c);
    currentRows.forEach(row => appendRow(outputEl, row));
  }

  function renderGrouped() {
    const winFrontSet = new Set(winInfo.fronts);
    const winBack = winInfo.back;

    const groups = {};
    ORDER.forEach(k => groups[k] = []);
    currentRows.forEach(row => {
      const r = classifyRow(row, winFrontSet, winBack);
      const key = r.front + '+' + r.back;
      if (groups[key]) groups[key].push(row);
    });

    // 顶部统计
    const c = document.createElement('div');
    c.className = 'count';
    c.innerHTML = '共 ' + currentRows.length + ' 行 ｜ 总注数：<b>' + totalBets + '</b> 注 ｜ 中奖号码：<b>' +
      winInfo.fronts.map(n => String(n).padStart(2, '0')).join(',') + '-' + String(winInfo.back).padStart(2, '0') + '</b>';
    outputEl.appendChild(c);

    ORDER.forEach(key => {
      const list = groups[key];
      if (!list.length) return;

      const g = document.createElement('div');
      g.className = 'group';

      const t = document.createElement('div');
      t.className = 'group-title';
      const label = '中' + key.replace('+', '➕');
      t.textContent = label + '（' + list.length + ' 行）';
      g.appendChild(t);

      list.forEach(row => appendRow(g, row));
      outputEl.appendChild(g);
    });
  }

  function appendRow(parent, row) {
    const r = document.createElement('div');
    r.className = 'row';

    const btn = document.createElement('button');
    btn.className = 'mini';
    btn.textContent = '复制';
    btn.addEventListener('click', function () {
      copyText(row.display).then(function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制'; }, 900);
      });
    });

    const code = document.createElement('code');
    code.textContent = row.display;

    r.appendChild(btn);
    r.appendChild(code);
    parent.appendChild(r);
  }

  /* ---------- 中奖号码 ---------- */
  function parseWin(str) {
    str = str.trim().replace(/，/g, ',').replace(/：/g, ':');
    const i = str.lastIndexOf('-');
    if (i <= 0) return null;
    const frontStr = str.slice(0, i);
    const backStr = str.slice(i + 1);
    const fronts = frontStr.split(/[,、\s]+/).filter(Boolean).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
    const backs = backStr.split(/[,、\s]+/).filter(Boolean).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
    if (fronts.length !== 6 || backs.length !== 1) return null;
    return { fronts, back: backs[0], raw: str };
  }

  function getAllDisplayRows() {
    if (!winInfo) return currentRows.map(r => r.display);
    const winFrontSet = new Set(winInfo.fronts);
    const winBack = winInfo.back;
    const groups = {};
    ORDER.forEach(k => groups[k] = []);
    currentRows.forEach(row => {
      const r = classifyRow(row, winFrontSet, winBack);
      const key = r.front + '+' + r.back;
      if (groups[key]) groups[key].push(row);
    });
    const result = [];
    ORDER.forEach(key => groups[key].forEach(r => result.push(r.display)));
    return result;
  }

  /* ---------- 复制 ---------- */
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).catch(function () { fallbackCopy(t); });
    }
    fallbackCopy(t);
    return Promise.resolve();
  }
  function fallbackCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 事件绑定 ---------- */
  document.getElementById('run').addEventListener('click', run);

  document.getElementById('winBtn').addEventListener('click', function () {
    if (!currentRows.length) { alert('请先输入原数据并点“确定”'); return; }
    const def = winInfo ? winInfo.raw : '';
    const input = prompt('请输入中奖号码（格式：1,2,3,4,5,6-1，支持中英文逗号，1-9 或 01-09 均可）', def);
    if (input === null) return;
    const parsed = parseWin(input);
    if (!parsed) { alert('格式不正确，请重新输入。示例：1,2,3,4,5,6-1'); return; }
    winInfo = parsed;
    render();
  });

  document.getElementById('copyAll').addEventListener('click', function () {
    const rows = getAllDisplayRows();
    if (!rows.length) { alert('没有可复制的结果'); return; }
    const self = this;
    copyText(rows.join('\n')).then(function () {
      const old = self.textContent;
      self.textContent = '已复制全部';
      setTimeout(function () { self.textContent = old; }, 900);
    });
  });

  document.getElementById('clearAll').addEventListener('click', function () {
    inputEl.value = '';
    currentRows = [];
    totalBets = 0;
    winInfo = null;
    render();
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
  });
})();
</script>
</body>
</html>
