<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组合合并工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; margin: 0; padding: 20px; color: #222;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .label { font-size: 14px; font-weight: 600; margin: 14px 0 6px; color: #333; }
  textarea {
    width: 100%; height: 190px; padding: 10px 12px;
    font-family: Consolas, Monaco, monospace; font-size: 14px;
    border: 1px solid #ccc; border-radius: 8px; resize: vertical;
    line-height: 1.6; background: #fff; outline: none;
  }
  textarea:focus { border-color: #2d7ef7; box-shadow: 0 0 0 3px rgba(45,126,247,.15); }
  .bar { margin: 12px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 9px 20px; border-radius: 8px; border: none;
    background: #2d7ef7; color: #fff; font-size: 14px; cursor: pointer;
    transition: .15s;
  }
  button:hover { background: #1a68db; }
  button.gray { background: #6b7280; }
  button.gray:hover { background: #4b5563; }
  button.mini {
    padding: 4px 10px; font-size: 12px; background: #10b981; flex: 0 0 auto;
    min-width: 58px;
  }
  button.mini:hover { background: #059669; }
  #output {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 10px 12px; min-height: 90px;
  }
  .row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0; border-bottom: 1px dashed #eee;
  }
  .row:last-child { border-bottom: none; }
  .row code {
    font-family: Consolas, Monaco, monospace; font-size: 14px;
    white-space: pre-wrap; word-break: break-all; line-height: 1.7;
    padding-top: 3px;
  }
  .empty { color: #aaa; font-size: 14px; padding: 8px 0; }
  .hint { font-size: 12px; color: #777; margin-top: 8px; line-height: 1.8; }
  .count { font-size: 13px; color: #2d7ef7; margin: 10px 0 6px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>组合合并工具</h1>

  <div class="label">① 输入原数据（每行一条）</div>
  <textarea id="input" placeholder="01,10,15,20,22,27,30,31-01
01,10,15,20,22,27,30,31-02
胆:03,24,29，拖:02,08,10,13,14,15,18,19,21,25,27,30,33-13"></textarea>

  <div class="bar">
    <button id="run">确定</button>
    <button id="copyAll" class="gray">复制全部结果</button>
    <button id="clearAll" class="gray">清空</button>
  </div>

  <div class="label">② 合并结果</div>
  <div id="output"><div class="empty">（还没有结果，请先输入数据并点“确定”）</div></div>

  <div class="hint">
    规则：只有<b>连续相邻</b>且 “-” 前面完全相同的行才会合并；后区去重并升序排列；
    输出行数 = 该段内某个后区号码出现的最大次数。<br>
    注数按双色球规则计算：前区选 6 个、后区选 1 个。复式为 C(前区个数,6)×后区个数，
    胆拖为 C(拖码个数, 6−胆码个数)×后区个数。输入内容会自动保存，下次打开自动恢复。
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'combine_input_v1';
  const inputEl  = document.getElementById('input');
  const outputEl = document.getElementById('output');

  let currentRows = [];   // 当前输出结果（字符串数组）
  let totalBets   = 0;    // 原始输入合计注数

  /* ---------- 组合数 ---------- */
  function comb(n, k) {
    if (k < 0 || n < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    k = Math.min(k, n - k);
    let r = 1;
    for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
    return Math.round(r);
  }

  /* ---------- 行解析 ---------- */
  function splitLine(line) {
    const s = line.trim();
    if (!s) return null;
    const i = s.lastIndexOf('-');
    if (i <= 0) return { front: s, backs: [] };
    return {
      front: s.slice(0, i).trim(),
      backs: s.slice(i + 1).trim().split(/[,，、\s]+/).filter(Boolean)
    };
  }

  // 用于比较前区是否相同（去空白、统一分隔符）
  function normFront(f) {
    return f.replace(/\s+/g, '').replace(/，/g, ',').replace(/、/g, ',');
  }

  /* ---------- 单行注数（双色球规则） ---------- */
  function countBets(line) {
    const p = splitLine(line);
    if (!p) return 0;
    const n = p.backs.length;
    if (n === 0) return 0;
    const front = p.front;

    const danMatch = front.match(/胆\s*[:：]\s*([\s\S]*?)\s*拖\s*[:：]\s*([\s\S]*)$/);
    if (danMatch) {
      const dan = danMatch[1].split(/[,，、\s]+/).filter(Boolean);
      const tuo = danMatch[2].split(/[,，、\s]+/).filter(Boolean);
      return comb(tuo.length, 6 - dan.length) * n;
    }

    const nums = front.split(/[,，、\s]+/).filter(Boolean);
    return comb(nums.length, 6) * n;
  }

  /* ---------- 核心合并 ---------- */
  function run() {
    const lines = inputEl.value.split(/\r?\n/);
    const items = [];
    totalBets = 0;

    for (const line of lines) {
      if (!line.trim()) continue;
      const p = splitLine(line);
      if (!p) continue;
      items.push(p);
      totalBets += countBets(line);
    }

    if (!items.length) {
      currentRows = [];
      render('（没有输入任何有效数据）');
      return;
    }

    // 1. 按“连续且前区相同”切成若干段
    const blocks = [];
    for (const it of items) {
      const key = normFront(it.front);
      const last = blocks[blocks.length - 1];
      if (last && last.key === key) {
        last.items.push(it);
      } else {
        blocks.push({ key: key, front: it.front, items: [it] });
      }
    }

    // 2. 每段内部合并后区
    currentRows = [];
    for (const b of blocks) {
      const map = new Map();   // key -> { text, count }
      for (const it of b.items) {
        for (const bk of it.backs) {
          const k = String(parseInt(bk, 10) || bk);
          if (!map.has(k)) map.set(k, { text: bk, count: 0 });
          map.get(k).count++;
        }
      }

      if (map.size === 0) {
        currentRows.push(b.front);
        continue;
      }

      const arr = Array.from(map.values()).sort(function (a, c) {
        const na = parseInt(a.text, 10), nc = parseInt(c.text, 10);
        if (!isNaN(na) && !isNaN(nc) && na !== nc) return na - nc;
        return a.text.localeCompare(c.text);
      });

      const backStr = arr.map(function (v) { return v.text; }).join(',');
      // 输出行数 = 该段内某个后区号码出现的最大次数
      const times = Math.max.apply(null, arr.map(function (v) { return v.count; }));

      for (let i = 0; i < times; i++) {
        currentRows.push(b.front + '-' + backStr);
      }
    }

    render();
  }

  /* ---------- 渲染 ---------- */
  function render(emptyText) {
    outputEl.innerHTML = '';

    if (!currentRows.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = emptyText || '（无输出）';
      outputEl.appendChild(d);
      return;
    }

    const c = document.createElement('div');
    c.className = 'count';
    c.textContent = '共 ' + currentRows.length + ' 行，合计 ' + totalBets + ' 注';
    outputEl.appendChild(c);

    currentRows.forEach(function (text) {
      const row = document.createElement('div');
      row.className = 'row';

      const btn = document.createElement('button');
      btn.className = 'mini';
      btn.textContent = '复制';
      btn.addEventListener('click', function () {
        copyText(text).then(function () {
          btn.textContent = '已复制';
          setTimeout(function () { btn.textContent = '复制'; }, 900);
        });
      });

      const code = document.createElement('code');
      code.textContent = text;

      row.appendChild(btn);   // 复制键在前面
      row.appendChild(code);
      outputEl.appendChild(row);
    });
  }

  /* ---------- 复制 ---------- */
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).catch(function () { fallbackCopy(t); });
    }
    fallbackCopy(t);
    return Promise.resolve();
  }

  function fallbackCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 本地存储 ---------- */
  function saveInput() {
    try { localStorage.setItem(STORAGE_KEY, inputEl.value); } catch (e) {}
  }

  /* ---------- 事件绑定 ---------- */
  document.getElementById('run').addEventListener('click', function () {
    saveInput();
    run();
  });

  // 输入时自动保存，下次打开恢复
  inputEl.addEventListener('input', saveInput);

  document.getElementById('copyAll').addEventListener('click', function () {
    if (!currentRows.length) { alert('没有可复制的结果'); return; }
    const self = this;
    copyText(currentRows.join('\n')).then(function () {
      const old = self.textContent;
      self.textContent = '已复制全部';
      setTimeout(function () { self.textContent = old; }, 900);
    });
  });

  document.getElementById('clearAll').addEventListener('click', function () {
    inputEl.value = '';
    currentRows = [];
    totalBets = 0;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    render('（还没有结果，请先输入数据并点“确定”）');
    inputEl.focus();
  });

  // Ctrl + Enter 快捷执行
  inputEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      saveInput();
      run();
    }
  });

  /* ---------- 启动时恢复上次输入 ---------- */
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      inputEl.value = saved;
      if (saved.trim()) run();
    }
  } catch (e) {}
})();
</script>
</body>
</html>
