<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组合合并工具（双模式切换 + 分组折叠 + 状态保存）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; margin: 0; padding: 20px; color: #222;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .label { font-size: 14px; font-weight: 600; margin: 14px 0 6px; color: #333; }
  textarea {
    width: 100%; height: 170px; padding: 10px 12px;
    font-family: Consolas, Monaco, monospace; font-size: 14px;
    border: 1px solid #ccc; border-radius: 8px; resize: vertical;
    line-height: 1.6; background: #fff; outline: none;
  }
  textarea:focus { border-color: #2d7ef7; box-shadow: 0 0 0 3px rgba(45,126,247,.15); }
  .bar { margin: 12px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    padding: 9px 20px; border-radius: 8px; border: none;
    background: #2d7ef7; color: #fff; font-size: 14px; cursor: pointer;
    transition: .15s;
  }
  button:hover { background: #1a68db; }
  button.gray { background: #6b7280; }
  button.gray:hover { background: #4b5563; }
  button.orange { background: #f59e0b; }
  button.orange:hover { background: #d97706; }
  button.purple { background: #8b5cf6; }
  button.purple:hover { background: #7c3aed; }
  button.mini {
    padding: 4px 10px; font-size: 12px; background: #10b981; flex: 0 0 auto;
    min-width: 58px;
  }
  button.mini:hover { background: #059669; }
  button.copy-mode { padding: 6px 14px; font-size: 13px; background: #2d7ef7; }
  button.copy-mode:hover { background: #1a68db; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #output { min-height: 90px; }
  .empty { color: #aaa; font-size: 14px; padding: 16px 0; }

  .mode-section {
    margin-top: 18px; border: 1px solid #ddd; border-radius: 8px;
    background: #fff; overflow: hidden;
  }
  .mode-title {
    background: #eef4ff; padding: 9px 14px; font-weight: 600;
    font-size: 15px; color: #1d4ed8; border-bottom: 1px solid #ddd;
  }
  .mode-bar { padding: 10px 14px 4px; }
  .stat-line {
    padding: 4px 14px 10px; font-size: 13px; color: #333;
    border-bottom: 1px dashed #e5e7eb; margin-bottom: 4px;
  }
  .group { margin: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
  .group-title {
    background: #f0f5ff; padding: 7px 12px; font-weight: 600;
    font-size: 13.5px; color: #1d4ed8; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; cursor: pointer; user-select: none;
  }
  .group-title:hover { background: #e0ebff; }
  .group-title .g-name { flex: 1; }
  .group-title .g-toggle {
    font-size: 12px; color: #4b5563; background: #fff;
    border: 1px solid #cbd5e1; border-radius: 6px;
    padding: 2px 9px; cursor: pointer; flex: 0 0 auto;
  }
  .group-title .g-toggle:hover { background: #f3f4f6; }
  .group-body.collapsed { display: none; }
  .row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 5px 12px; border-bottom: 1px dashed #f0f0f0;
  }
  .row:last-child { border-bottom: none; }
  .row code {
    font-family: Consolas, Monaco, monospace; font-size: 14px;
    white-space: pre-wrap; word-break: break-all; line-height: 1.7;
    padding-top: 3px;
  }
  .flat-count {
    font-size: 13px; color: #2d7ef7; margin: 10px 0 6px; font-weight: 600;
    line-height: 1.8;
  }
  .flat-count b { color: #e11d48; }
  .flat-list { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; }
  .hint { font-size: 12px; color: #777; margin-top: 8px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>组合合并工具（双模式切换 + 分组折叠 + 状态保存）</h1>

  <div class="label">① 输入原数据（每行一条）</div>
  <textarea id="input" placeholder="01,10,15,20,22,27,30,31-01
01,10,15,20,22,27,30,31-02
胆:03,24,29，拖:02,08,10,13,14,15,18,19,21,25,27,30,33-13"></textarea>

  <div class="bar">
    <button id="run">确定</button>
    <button id="winBtn" class="orange">输入中奖号码</button>
    <button id="toggleBtn" class="purple" disabled>切换模式</button>
    <button id="copyModeBtn" class="gray" disabled>复制当前模式全部</button>
    <button id="clearAll" class="gray">清空</button>
  </div>

  <div class="label">② 合并结果</div>
  <div id="output"><div class="empty">（还没有结果，请先输入数据并点“确定”）</div></div>

  <div class="hint">
    只有<b>连续相邻</b>且 “-” 前面完全相同的行才会合并；后区去重升序；
    后区覆盖 01~16 时显示 <b>-全部</b>；重复组合用 <b>✖️次数</b> 表示。
    注数按前区 6 个号、后区 1 个号的组合规则计算：C(前区个数,6) × 后区总数（后区“全部”按 16 个计算），带 ✖️N 时已折算。
    点击“输入中奖号码”后可按模式1（命中情况）或模式2（结构分类）查看；每种情况可单独收起/展开。
    页面会自动保存输入数据、中奖号码和当前模式，下次打开自动恢复。
  </div>
</div>

<script>
(function () {
  const inputEl  = document.getElementById('input');
  const outputEl = document.getElementById('output');
  const toggleBtn = document.getElementById('toggleBtn');
  const copyModeBtn = document.getElementById('copyModeBtn');

  const STORAGE_KEY = 'combo_tool_state_v2';

  let currentRows = [];
  let totalBets   = 0;
  let winInfo     = null;
  let currentMode = 1;
  let collapsedState = {}; // 'm1:6+1' -> true

  const ORDER_HIT = ['6+1','6+0','5+1','5+0','4+1','4+0','3+1','2+1','1+1','0+1','3+0','2+0','1+0','0+0'];

  const ORDER_BUCKET = [
    '6+16','6+3','6+2','6+1',
    '7+16','7+5','7+1',
    '8+1','9+1','15+1',
    '1胆x拖+3','1胆x拖+1','2胆x拖+3','2胆x拖+1'
  ];

  /* ---------- 组合数 ---------- */
  function comb(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    k = Math.min(k, n - k);
    let r = 1;
    for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
    return Math.round(r);
  }

  /* ---------- 工具 ---------- */
  function keyOf(s) {
    const n = parseInt(s, 10);
    return isNaN(n) ? s : n;
  }
  function numOf(s) {
    const n = parseInt(s, 10);
    return isNaN(n) ? 999999 : n;
  }

  function splitLine(line) {
    let s = line.trim();
    if (!s) return null;
    s = s.replace(/[（(][^（）()]*[）)]\s*$/, '').trim();
    if (!s) return null;

    let multiplier = 1;
    const m = s.match(/\s*[✖×xX*]\uFE0F?\s*(\d+)\s*$/);
    if (m) {
      multiplier = parseInt(m[1], 10) || 1;
      s = s.slice(0, m.index).trim();
    }

    const i = s.lastIndexOf('-');
    if (i <= 0) {
      return { front: s.replace(/\s+/g, ''), backs: [], multiplier, backAll: false };
    }
    const front = s.slice(0, i).trim();
    const backStr = s.slice(i + 1).trim();
    if (/^全部$/.test(backStr)) {
      return { front, backs: [], multiplier, backAll: true };
    }
    const backs = backStr.split(/[,，、\s]+/).filter(Boolean);
    return { front, backs, multiplier, backAll: false };
  }

  function parseFront(front) {
    if (/[胆拖]/.test(front)) {
      let danStr = '', tuoStr = '';
      const dm = front.match(/胆\s*[:：]?\s*([\d,，、\s]+)/);
      const tm = front.match(/拖\s*[:：]?\s*([\d,，、\s]+)/);
      if (dm) danStr = dm[1];
      if (tm) tuoStr = tm[1];
      const danNums = danStr.split(/[,，、\s]+/).filter(Boolean);
      const tuoNums = tuoStr.split(/[,，、\s]+/).filter(Boolean);
      return {
        isDanTuo: true, danNums, tuoNums,
        danCount: danNums.length, tuoCount: tuoNums.length,
        nums: danNums.concat(tuoNums),
        frontCount: danNums.length + tuoNums.length
      };
    }
    const nums = front.split(/[,，、\s]+/).filter(Boolean);
    return { isDanTuo: false, nums, danNums: [], tuoNums: [], danCount: 0, tuoCount: 0, frontCount: nums.length };
  }

  function frontCombOf(fi) {
    if (fi.isDanTuo) {
      const need = 6 - fi.danCount;
      if (need < 0 || need > fi.tuoCount) return 0;
      return comb(fi.tuoCount, need);
    }
    if (fi.frontCount < 6) return 0;
    return comb(fi.frontCount, 6);
  }

  function getCatText(fi, backCount) {
    if (fi.isDanTuo) return fi.danCount + '胆' + fi.tuoCount + '拖➕' + backCount;
    return fi.frontCount + '➕' + backCount;
  }

  function frontTotalOf(row) {
    const fi = row.frontInfo;
    return fi.isDanTuo ? fi.danCount + fi.tuoCount : fi.frontCount;
  }

  /* ---------- 核心合并 ---------- */
  function run() {
    const lines = inputEl.value.split(/\r?\n/);
    const items = [];
    for (const line of lines) {
      const p = splitLine(line);
      if (p) items.push(p);
    }

    if (!items.length) {
      currentRows = [];
      totalBets = 0;
      winInfo = null;
      saveState();
      render();
      return;
    }

    const blocks = [];
    for (const it of items) {
      const last = blocks[blocks.length - 1];
      if (last && last.front === it.front) last.items.push(it);
      else blocks.push({ front: it.front, items: [it] });
    }

    currentRows = [];
    totalBets = 0;

    for (const b of blocks) {
      const map = new Map();
      let hasBack = false;

      for (const it of b.items) {
        const mult = it.multiplier || 1;
        if (it.backAll) {
          hasBack = true;
          for (let n = 1; n <= 16; n++) {
            if (!map.has(n)) map.set(n, { text: String(n), count: 0 });
            map.get(n).count += mult;
          }
        } else {
          if (it.backs.length > 0) hasBack = true;
          for (const bk of it.backs) {
            const k = keyOf(bk);
            if (!map.has(k)) map.set(k, { text: bk, count: 0 });
            map.get(k).count += mult;
          }
        }
      }

      let base, maxCount = 1, sumCount = 0, backCount = 0, backAll = false;
      let backNums = [];

      if (!hasBack) {
        base = b.front;
        maxCount = b.items.reduce(function (a, it) { return a + (it.multiplier || 1); }, 0);
        sumCount = 0;
        backCount = 0;
      } else {
        const arr = Array.from(map.values())
          .sort(function (a, c) { return numOf(a.text) - numOf(c.text) || a.text.localeCompare(c.text); });

        let isAll = false;
        if (map.size === 16) {
          isAll = true;
          for (let i = 1; i <= 16; i++) {
            if (!map.has(i)) { isAll = false; break; }
          }
        }

        backNums = arr.map(function (v) { return keyOf(v.text); });

        if (isAll) {
          base = b.front + '-全部';
          backAll = true;
          backCount = 16;
        } else {
          base = b.front + '-' + arr.map(function (v) { return v.text; }).join(',');
          backCount = arr.length;
        }

        maxCount = Math.max.apply(null, arr.map(function (v) { return v.count; }));
        sumCount = arr.reduce(function (a, v) { return a + v.count; }, 0);
      }

      const fi = parseFront(b.front);
      const fc = frontCombOf(fi);
      const bets = fc * sumCount;
      totalBets += bets;

      let display = base;
      if (maxCount > 1) display += ' ✖️' + maxCount;

      currentRows.push({
        front: b.front,
        frontInfo: fi,
        backNums: backNums,
        backAll: backAll,
        maxCount: maxCount,
        sumCount: sumCount,
        backCount: backCount,
        bets: bets,
        display: display,
        catText: getCatText(fi, backCount)
      });
    }

    saveState();
    render();
  }

  /* ---------- 命中判定 ---------- */
  function classifyRow(row, winFrontSet, winBack) {
    const fi = row.frontInfo;
    let hit;
    if (fi.isDanTuo) {
      const danHit = fi.danNums.filter(function (n) { return winFrontSet.has(parseInt(n, 10)); }).length;
      const tuoHit = fi.tuoNums.filter(function (n) { return winFrontSet.has(parseInt(n, 10)); }).length;
      hit = danHit + Math.min(tuoHit, 6 - fi.danCount);
    } else {
      const raw = fi.nums.filter(function (n) { return winFrontSet.has(parseInt(n, 10)); }).length;
      hit = Math.min(raw, 6);
    }
    let backHit = 0;
    if (row.backAll) backHit = 1;
    else if (row.backNums.some(function (n) { return n === winBack; })) backHit = 1;
    return { front: hit, back: backHit };
  }

  function getHitText(row, winInfo) {
    const winFrontSet = new Set(winInfo.fronts);
    const r = classifyRow(row, winFrontSet, winInfo.back);
    return r.front + '➕' + r.back;
  }

  function bucketKeyOf(row) {
    const fi = row.frontInfo;
    const bc = row.backCount;
    if (!fi.isDanTuo) {
      const fc = fi.frontCount;
      if (fc === 6 && bc === 16) return '6+16';
      if (fc === 6 && bc === 3)  return '6+3';
      if (fc === 6 && bc === 2)  return '6+2';
      if (fc === 6 && bc === 1)  return '6+1';
      if (fc === 7 && bc === 16) return '7+16';
      if (fc === 7 && bc === 5)  return '7+5';
      if (fc === 7 && bc === 1)  return '7+1';
      if (fc === 8 && bc === 1)  return '8+1';
      if (fc === 9 && bc === 1)  return '9+1';
      if (fc === 15 && bc === 1) return '15+1';
    } else {
      const dc = fi.danCount;
      if (dc === 1 && bc === 3) return '1胆x拖+3';
      if (dc === 1 && bc === 1) return '1胆x拖+1';
      if (dc === 2 && bc === 3) return '2胆x拖+3';
      if (dc === 2 && bc === 1) return '2胆x拖+1';
    }
    return null;
  }

  function formatWin(winInfo) {
    const f = winInfo.fronts.map(function (n) { return String(n).padStart(2, '0'); }).join(',');
    const b = String(winInfo.back).padStart(2, '0');
    return f + '-' + b;
  }

  /* ---------- 排序 ---------- */
  // 模式1：复式在前、胆拖在后；同类型按前区总数升序，再按后区数升序
  function sortMode1Rows(list) {
    return list.slice().sort(function (a, b) {
      const aDan = a.frontInfo.isDanTuo ? 1 : 0;
      const bDan = b.frontInfo.isDanTuo ? 1 : 0;
      if (aDan !== bDan) return aDan - bDan;
      const fa = frontTotalOf(a);
      const fb = frontTotalOf(b);
      if (fa !== fb) return fa - fb;
      if (a.backCount !== b.backCount) return a.backCount - b.backCount;
      return 0;
    });
  }

  // 模式2：组内按命中情况由多到少（ORDER_HIT 顺序），再按前区总数升序
  function sortMode2Rows(list, winInfo) {
    const winFrontSet = new Set(winInfo.fronts);
    const winBack = winInfo.back;
    return list.slice().sort(function (a, b) {
      const ra = classifyRow(a, winFrontSet, winBack);
      const rb = classifyRow(b, winFrontSet, winBack);
      const ia = ORDER_HIT.indexOf(ra.front + '+' + ra.back);
      const ib = ORDER_HIT.indexOf(rb.front + '+' + rb.back);
      if (ia !== ib) return ia - ib;
      const fa = frontTotalOf(a);
      const fb = frontTotalOf(b);
      if (fa !== fb) return fa - fb;
      return 0;
    });
  }

  /* ---------- 渲染 ---------- */
  function render() {
    outputEl.innerHTML = '';

    const hasGroups = !!winInfo;
    toggleBtn.disabled = !hasGroups;
    copyModeBtn.disabled = !hasGroups;
    if (hasGroups) {
      toggleBtn.textContent = currentMode === 1 ? '切换到模式2' : '切换到模式1';
      copyModeBtn.textContent = '复制模式' + currentMode + '全部';
    } else {
      toggleBtn.textContent = '切换模式';
      copyModeBtn.textContent = '复制当前模式全部';
    }

    if (!currentRows.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '（还没有结果，请先输入数据并点“确定”）';
      outputEl.appendChild(d);
      return;
    }

    if (!winInfo) {
      renderFlat();
    } else if (currentMode === 1) {
      renderMode1();
    } else {
      renderMode2();
    }
  }

  function renderFlat() {
    const c = document.createElement('div');
    c.className = 'flat-count';
    c.innerHTML = '共 ' + currentRows.length + ' 行 ｜ 总注数：<b>' + totalBets + '</b> 注';
    outputEl.appendChild(c);

    const list = document.createElement('div');
    list.className = 'flat-list';
    currentRows.forEach(function (row) {
      const r = document.createElement('div');
      r.className = 'row';
      const btn = document.createElement('button');
      btn.className = 'mini';
      btn.textContent = '复制';
      btn.addEventListener('click', function () {
        copyText(row.display).then(function () {
          btn.textContent = '已复制';
          setTimeout(function () { btn.textContent = '复制'; }, 900);
        });
      });
      const code = document.createElement('code');
      code.textContent = row.display;
      r.appendChild(btn);
      r.appendChild(code);
      list.appendChild(r);
    });
    outputEl.appendChild(list);
  }

  function renderMode1() {
    const winFrontSet = new Set(winInfo.fronts);
    const winBack = winInfo.back;
    const winStr = formatWin(winInfo);
    const statLine = '共 ' + currentRows.length + ' 行 ｜ 总注数：' + totalBets + ' 注 ｜ 中奖号码：' + winStr;

    const groups = {};
    ORDER_HIT.forEach(function (k) { groups[k] = []; });
    currentRows.forEach(function (row) {
      const r = classifyRow(row, winFrontSet, winBack);
      const key = r.front + '+' + r.back;
      if (groups[key]) groups[key].push(row);
    });

    const sec = document.createElement('div');
    sec.className = 'mode-section';

    const title = document.createElement('div');
    title.className = 'mode-title';
    title.textContent = '模式1：按命中情况分组';
    sec.appendChild(title);

    const bar = document.createElement('div');
    bar.className = 'mode-bar';
    const btn = document.createElement('button');
    btn.className = 'copy-mode';
    btn.textContent = '复制模式1全部';
    btn.addEventListener('click', function () {
      const text = buildText(statLine, groups, ORDER_HIT, 'hit');
      copyText(text).then(function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制模式1全部'; }, 900);
      });
    });
    bar.appendChild(btn);
    sec.appendChild(bar);

    const stat = document.createElement('div');
    stat.className = 'stat-line';
    stat.textContent = statLine;
    sec.appendChild(stat);

    ORDER_HIT.forEach(function (key) {
      let list = groups[key];
      if (!list.length) return;
      list = sortMode1Rows(list);

      const g = document.createElement('div');
      g.className = 'group';

      const t = document.createElement('div');
      t.className = 'group-title';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'g-name';
      nameSpan.textContent = '中' + key.replace('+', '➕') + '（' + list.length + ' 行）';
      t.appendChild(nameSpan);

      const toggleSpan = document.createElement('span');
      toggleSpan.className = 'g-toggle';
      t.appendChild(toggleSpan);

      const body = document.createElement('div');
      body.className = 'group-body';

      const collapsed = !!collapsedState['m1:' + key];
      if (collapsed) body.classList.add('collapsed');
      toggleSpan.textContent = collapsed ? '展开' : '收起';

      t.addEventListener('click', function () {
        const isC = body.classList.toggle('collapsed');
        collapsedState['m1:' + key] = isC;
        toggleSpan.textContent = isC ? '展开' : '收起';
        saveState();
      });

      list.forEach(function (row) {
        appendDisplayRow(body, row.display, row.display + '（' + row.catText + '）');
      });

      g.appendChild(t);
      g.appendChild(body);
      sec.appendChild(g);
    });

    outputEl.appendChild(sec);
  }

  function renderMode2() {
    const winStr = formatWin(winInfo);
    const statLine = '共 ' + currentRows.length + ' 行 ｜ 总注数：' + totalBets + ' 注 ｜ 中奖号码：' + winStr;

    const groups = {};
    ORDER_BUCKET.forEach(function (k) { groups[k] = []; });
    currentRows.forEach(function (row) {
      const key = bucketKeyOf(row);
      if (key && groups[key]) groups[key].push(row);
    });

    const sec = document.createElement('div');
    sec.className = 'mode-section';

    const title = document.createElement('div');
    title.className = 'mode-title';
    title.textContent = '模式2：按结构分类（组内按命中由多到少）';
    sec.appendChild(title);

    const bar = document.createElement('div');
    bar.className = 'mode-bar';
    const btn = document.createElement('button');
    btn.className = 'copy-mode';
    btn.textContent = '复制模式2全部';
    btn.addEventListener('click', function () {
      const text = buildText(statLine, groups, ORDER_BUCKET, 'hitwin');
      copyText(text).then(function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制模式2全部'; }, 900);
      });
    });
    bar.appendChild(btn);
    sec.appendChild(bar);

    const stat = document.createElement('div');
    stat.className = 'stat-line';
    stat.textContent = statLine;
    sec.appendChild(stat);

    ORDER_BUCKET.forEach(function (key) {
      let list = groups[key];
      if (!list.length) return;
      list = sortMode2Rows(list, winInfo);

      const g = document.createElement('div');
      g.className = 'group';

      const t = document.createElement('div');
      t.className = 'group-title';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'g-name';
      nameSpan.textContent = key.replace('+', '➕') + '（' + list.length + ' 行）';
      t.appendChild(nameSpan);

      const toggleSpan = document.createElement('span');
      toggleSpan.className = 'g-toggle';
      t.appendChild(toggleSpan);

      const body = document.createElement('div');
      body.className = 'group-body';

      const collapsed = !!collapsedState['m2:' + key];
      if (collapsed) body.classList.add('collapsed');
      toggleSpan.textContent = collapsed ? '展开' : '收起';

      t.addEventListener('click', function () {
        const isC = body.classList.toggle('collapsed');
        collapsedState['m2:' + key] = isC;
        toggleSpan.textContent = isC ? '展开' : '收起';
        saveState();
      });

      list.forEach(function (row) {
        const hitText = getHitText(row, winInfo);
        appendDisplayRow(body, row.display, row.display + '（' + hitText + '）');
      });

      g.appendChild(t);
      g.appendChild(body);
      sec.appendChild(g);
    });

    outputEl.appendChild(sec);
  }

  function appendDisplayRow(parent, copyValue, displayText) {
    const r = document.createElement('div');
    r.className = 'row';

    const btn = document.createElement('button');
    btn.className = 'mini';
    btn.textContent = '复制';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      copyText(copyValue).then(function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制'; }, 900);
      });
    });

    const code = document.createElement('code');
    code.textContent = displayText;

    r.appendChild(btn);
    r.appendChild(code);
    parent.appendChild(r);
  }

  /* ---------- 构建复制文本：组间空行 ---------- */
  function buildText(statLine, groups, order, kind) {
    const lines = [statLine, ''];
    order.forEach(function (key) {
      const list = groups[key];
      if (!list.length) return;
      if (kind === 'hit') {
        const sorted = sortMode1Rows(list);
        lines.push('中' + key.replace('+', '➕') + '（' + sorted.length + ' 行）');
        sorted.forEach(function (row) {
          lines.push(row.display + '（' + row.catText + '）');
        });
      } else {
        const sorted = sortMode2Rows(list, winInfo);
        lines.push(key.replace('+', '➕') + '（' + sorted.length + ' 行）');
        sorted.forEach(function (row) {
          lines.push(row.display + '（' + getHitText(row, winInfo) + '）');
        });
      }
      lines.push('');
    });
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines.join('\n');
  }

  function buildCurrentModeText() {
    if (!winInfo) return '';
    const statLine = '共 ' + currentRows.length + ' 行 ｜ 总注数：' + totalBets + ' 注 ｜ 中奖号码：' + formatWin(winInfo);
    if (currentMode === 1) {
      const groups = {};
      ORDER_HIT.forEach(function (k) { groups[k] = []; });
      const winFrontSet = new Set(winInfo.fronts);
      currentRows.forEach(function (row) {
        const r = classifyRow(row, winFrontSet, winInfo.back);
        const key = r.front + '+' + r.back;
        if (groups[key]) groups[key].push(row);
      });
      return buildText(statLine, groups, ORDER_HIT, 'hit');
    } else {
      const groups = {};
      ORDER_BUCKET.forEach(function (k) { groups[k] = []; });
      currentRows.forEach(function (row) {
        const key = bucketKeyOf(row);
        if (key && groups[key]) groups[key].push(row);
      });
      return buildText(statLine, groups, ORDER_BUCKET, 'hitwin');
    }
  }

  /* ---------- 中奖号码解析 ---------- */
  function parseWin(str) {
    str = str.trim().replace(/，/g, ',');
    const i = str.lastIndexOf('-');
    if (i <= 0) return null;
    const frontStr = str.slice(0, i);
    const backStr = str.slice(i + 1);
    const fronts = frontStr.split(/[,、\s]+/).filter(Boolean).map(function (n) { return parseInt(n, 10); }).filter(function (n) { return !isNaN(n); });
    const backs = backStr.split(/[,、\s]+/).filter(Boolean).map(function (n) { return parseInt(n, 10); }).filter(function (n) { return !isNaN(n); });
    if (fronts.length !== 6 || backs.length !== 1) return null;
    return { fronts: fronts, back: backs[0], raw: str };
  }

  /* ---------- 复制 ---------- */
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).catch(function () { fallbackCopy(t); });
    }
    fallbackCopy(t);
    return Promise.resolve();
  }
  function fallbackCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 状态保存 ---------- */
  function saveState() {
    try {
      const state = {
        input: inputEl.value,
        winRaw: winInfo ? winInfo.raw : '',
        mode: currentMode,
        collapsed: collapsedState
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function loadState() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (!s) return;
      const state = JSON.parse(s);
      if (state.input) inputEl.value = state.input;
      if (state.winRaw) {
        const p = parseWin(state.winRaw);
        if (p) winInfo = p;
      }
      if (state.mode === 1 || state.mode === 2) currentMode = state.mode;
      if (state.collapsed && typeof state.collapsed === 'object') collapsedState = state.collapsed;
    } catch (e) {}
  }

  /* ---------- 事件 ---------- */
  document.getElementById('run').addEventListener('click', run);

  document.getElementById('winBtn').addEventListener('click', function () {
    if (!currentRows.length) { alert('请先输入原数据并点“确定”'); return; }
    const def = winInfo ? winInfo.raw : '';
    const input = prompt('请输入中奖号码（格式：1,2,3,4,5,6-1，支持中英文逗号，1-9 或 01-09 均可）', def);
    if (input === null) return;
    const parsed = parseWin(input);
    if (!parsed) { alert('格式不正确，请重新输入。示例：1,2,3,4,5,6-1'); return; }
    winInfo = parsed;
    currentMode = 1;
    saveState();
    render();
  });

  toggleBtn.addEventListener('click', function () {
    if (!winInfo) return;
    currentMode = currentMode === 1 ? 2 : 1;
    saveState();
    render();
    document.querySelector('.bar').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  copyModeBtn.addEventListener('click', function () {
    if (!winInfo) return;
    const text = buildCurrentModeText();
    const self = this;
    copyText(text).then(function () {
      const old = self.textContent;
      self.textContent = '已复制';
      setTimeout(function () { self.textContent = old; }, 900);
    });
  });

  document.getElementById('clearAll').addEventListener('click', function () {
    inputEl.value = '';
    currentRows = [];
    totalBets = 0;
    winInfo = null;
    currentMode = 1;
    collapsedState = {};
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    render();
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
  });

  // 输入内容变化时也保存（防止未点确定就刷新丢失）
  inputEl.addEventListener('input', function () {
    saveState();
  });

  /* ---------- 页面加载恢复 ---------- */
  loadState();
  if (inputEl.value.trim()) {
    run();
  } else {
    render();
  }
})();
</script>
</body>
</html>
